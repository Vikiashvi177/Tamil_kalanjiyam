<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பாசுரம் · அமலனாதிபிரான்</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/amalan.css"/>
  <style>
    :root {
      --an-blue:       #1a3a6b;
      --an-blue-mid:   #2a52a0;
      --an-blue-pale:  rgba(26,58,107,.08);
      --an-blue-pale2: rgba(26,58,107,.14);
      --an-sapphire:   #0f254a;
      --tp-flame:      #1a3a6b;
      --tp-flame-mid:  #2a52a0;
      --tp-flame-pale: rgba(26,58,107,.08);
      --tp-flame-pale2:rgba(26,58,107,.14);
      --tp-gold:       #1a3a6b;
    }

    .an-pasuram-page { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .an-bc {
      display:flex; align-items:center; gap:.5rem;
      font-size:.875rem; color:var(--ink-muted);
      margin-bottom:2rem; letter-spacing:.04em; flex-wrap:wrap;
    }
    .an-bc a { color:var(--ink-secondary); text-decoration:none; }
    .an-bc a:hover { color:var(--an-blue); }
    .an-bc .sep { opacity:.45; }

    /* Ascending position badge */
    .an-position-badge {
      display:inline-flex; align-items:center; gap:.5rem;
      background: rgba(26,58,107,.07);
      border: 1px solid rgba(26,58,107,.2);
      border-radius: 20px;
      padding: .3rem .85rem;
      font-family: var(--font-display);
      font-size: .75rem;
      color: var(--an-blue);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .an-pasuram-card {
      position:relative;
      background:var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(26,58,107,0) 0%, rgba(26,58,107,.03) 50%, rgba(26,58,107,0) 100%),
        repeating-linear-gradient(0deg,
          rgba(26,58,107,.02) 0px, rgba(26,58,107,.02) 1px,
          transparent 1px, transparent 8px);
      border:1px solid var(--border-medium);
      border-radius:4px;
      padding:3.5rem 3rem;
      box-shadow:var(--shadow-paper);
      overflow:hidden;
    }
    .an-pasuram-card::before,
    .an-pasuram-card::after {
      content:''; position:absolute; top:50%; transform:translateY(-50%);
      width:14px; height:14px; border-radius:50%;
      background:var(--bg-primary); border:1.5px solid var(--border-strong);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
    }
    .an-pasuram-card::before { left:14px; }
    .an-pasuram-card::after  { right:14px; }

    .an-pasuram-num {
      text-align:center; font-family:var(--font-display);
      font-size:.78rem; letter-spacing:.28em; text-transform:uppercase;
      color:var(--an-blue); margin-bottom:.3rem;
    }
    .an-incipit {
      text-align:center; font-family:var(--font-display);
      font-style:italic; font-size:1rem; color:var(--an-blue);
      margin-bottom:2rem; letter-spacing:.03em;
    }

    .an-panel-label {
      font-family:var(--font-display); font-size:.72rem;
      letter-spacing:.25em; text-transform:uppercase;
      color:var(--an-blue); margin-bottom:.65rem; font-weight:500;
    }
    .an-tamil-panel {
      margin-bottom:1.75rem; padding-bottom:1.75rem;
      border-bottom:1px solid var(--border-subtle);
    }
    .an-tamil-text {
      font-family:var(--font-tamil); font-size:1.875rem;
      line-height:1.65; color:var(--ink-primary); font-weight:600;
      white-space:pre-line; margin:0;
    }
    .an-listen-btn {
      display:inline-flex; align-items:center; gap:.45rem;
      margin-top:.85rem; padding:.45rem .9rem;
      background:rgba(26,58,107,.07); border:1px solid var(--an-blue);
      border-radius:20px; color:var(--an-blue);
      font-family:var(--font-display); font-size:.8rem;
      letter-spacing:.1em; text-transform:uppercase;
      cursor:pointer; transition:all .15s;
    }
    .an-listen-btn:hover { background:var(--an-blue); color:var(--bg-paper); }

    .an-collapsible {
      background:var(--bg-paper); border:1px solid rgba(26,58,107,.2);
      border-radius:4px; margin-bottom:.75rem; overflow:hidden;
    }
    .an-toggle {
      width:100%; text-align:left; background:none; border:none;
      cursor:pointer; padding:1rem 1.5rem;
      font-family:var(--font-display); font-size:.9rem;
      color:var(--ink-secondary); display:flex; align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(26,58,107,.12); transition:background .12s;
    }
    .an-toggle:hover { background:rgba(26,58,107,.07); }
    .an-toggle .arrow { font-size:.75rem; transition:transform .2s; color:var(--an-blue); }
    .an-toggle.open .arrow { transform:rotate(180deg); }
    .an-panel-body { padding:1.2rem 1.5rem 1.4rem; display:none; }
    .an-panel-body.open { display:block; }

    .an-translit { font-family:var(--font-body); font-style:italic; font-size:1.15rem; line-height:1.65; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .an-english  { font-family:var(--font-display); font-size:1.25rem; font-style:italic; line-height:1.65; color:var(--ink-primary); white-space:pre-line; margin:0; }
    .an-urai     { font-family:var(--font-tamil); font-size:1.0625rem; line-height:1.85; color:var(--ink-secondary); }
    .an-alt      { font-family:var(--font-display); font-style:italic; font-size:1.1rem; line-height:1.7; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .an-theme    { font-family:var(--font-body); font-size:.975rem; line-height:1.75; color:var(--ink-secondary); }
    .an-note     { font-family:var(--font-body); font-size:.975rem; line-height:1.8; color:var(--ink-secondary); }

    /* Journey progress strip */
    .an-progress {
      display:flex; align-items:center; justify-content:center;
      gap:.25rem; margin-bottom:1.5rem; flex-wrap:wrap;
    }
    .an-progress-dot {
      width:8px; height:8px; border-radius:50%;
      background: rgba(26,58,107,.2);
      transition: background .2s;
    }
    .an-progress-dot.active { background: var(--an-blue); }
    .an-progress-dot.visited { background: rgba(26,58,107,.45); }

    .an-nav {
      display:grid; grid-template-columns:1fr 1fr;
      gap:1rem; margin-top:2.5rem;
    }
    .an-nav-link {
      display:block; padding:1.2rem 1.4rem;
      background:var(--bg-paper); border:1px solid var(--border-subtle);
      border-radius:4px; text-decoration:none; color:inherit;
      transition:all .2s ease;
    }
    .an-nav-link:hover { border-color:var(--an-blue); transform:translateY(-2px); box-shadow:var(--shadow-paper); }
    .an-nav-link.next { text-align:right; }
    .an-nav-link.disabled { opacity:.35; pointer-events:none; }
    .an-nav-dir { font-family:var(--font-display); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.35rem; }
    .an-nav-incipit { font-family:var(--font-display); font-style:italic; font-size:.85rem; color:var(--an-blue); margin-bottom:.2rem; }
    .an-nav-gaze { font-family:var(--font-display); font-size:.72rem; color:var(--an-blue); opacity:.7; margin-bottom:.15rem; letter-spacing:.08em; }
    .an-nav-tamil { font-family:var(--font-tamil); font-size:.95rem; color:var(--ink-primary); line-height:1.4; }

    @media (max-width:640px) {
      .an-pasuram-card { padding:2.5rem 1.5rem; }
      .an-tamil-text   { font-size:1.5rem; }
      .an-nav          { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark" style="color:var(--an-blue,#1a3a6b)">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M 4 20 Q 20 6 36 20 Q 20 34 4 20 Z"
                  fill="currentColor" opacity=".18" stroke="currentColor" stroke-width="1.2"/>
            <circle cx="20" cy="20" r="6.5" fill="currentColor" opacity=".55" stroke="none"/>
            <circle cx="20" cy="20" r="3"   fill="currentColor" opacity=".9"  stroke="none"/>
            <path d="M 12 14 Q 20 10 28 14" stroke-width="1" opacity=".4"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil" style="color:var(--an-blue,#1a3a6b)">அமலனாதிபிரான்</span>
          <span class="wordmark-english">Amalanādipirān</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Pāsurams</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="an-pasuram-page">
      <nav class="an-bc" id="bc"></nav>
      <div class="an-progress" id="progress"></div>
      <div id="position-badge"></div>
      <div class="an-pasuram-card" id="pasuram-card"></div>
      <nav class="an-nav" id="pasuram-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(26,58,107,.15);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--an-blue,#1a3a6b);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>அமலனாதிபிரான் · <a href="../index.html" style="color:var(--an-blue,#1a3a6b)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/verses.js"></script>
  <script>
  (function(){
    const { verses } = window.AN_DATA;
    const params = new URLSearchParams(window.location.search);
    const num    = parseInt(params.get('n'), 10) || 1;
    const verse  = verses.find(v => v.num === num);
    const card   = document.getElementById('pasuram-card');
    const nav    = document.getElementById('pasuram-nav');
    const bc     = document.getElementById('bc');

    const gazeLabels = [
      'Lotus Feet', 'Anklets & Feet', 'Sacred Legs', 'Waist & Inner Heart',
      'Sacred Navel', 'The Chest', 'The Arms', 'Upper Chest',
      'The Sacred Face', 'The Soul Consumed'
    ];

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    if (!verse) {
      card.innerHTML = '<p style="text-align:center;padding:2rem">Pāsuram not found. <a href="index.html" style="color:var(--an-blue)">Return →</a></p>';
      return;
    }

    const idx = verses.findIndex(v => v.num === num);

    document.getElementById('page-title').textContent =
      'Pāsuram ' + verse.num + ' · ' + verse.incipit + ' · அமலனாதிபிரான்';

    // Breadcrumb
    bc.innerHTML =
      '<a href="../index.html">Library</a><span class="sep"> › </span>' +
      '<a href="index.html">Amalanādipirān</a><span class="sep"> › </span>' +
      '<span>Pāsuram ' + verse.num + '</span>';

    // Progress dots
    const prog = document.getElementById('progress');
    verses.forEach((v, i) => {
      const dot = document.createElement('div');
      dot.className = 'an-progress-dot' + (i === idx ? ' active' : i < idx ? ' visited' : '');
      dot.title = gazeLabels[i] || '';
      prog.appendChild(dot);
    });

    // Position badge
    const badge = document.getElementById('position-badge');
    badge.innerHTML = '<div class="an-position-badge">👁 ' + esc(gazeLabels[idx] || '') + '</div>';

    // Main card
    card.innerHTML =
      '<div class="an-pasuram-num">அமலனாதிபிரான் · Pāsuram ' + verse.num + ' of 10</div>' +
      '<div class="an-incipit">' + esc(verse.incipit) + '</div>' +

      '<div class="an-tamil-panel">' +
        '<div class="an-panel-label">Tamil · தமிழ்</div>' +
        '<pre class="an-tamil-text">' + escPre(verse.tamil) + '</pre>' +
        '<button class="an-listen-btn" onclick="speakTamil(' + JSON.stringify(verse.tamil) + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          'Listen · கேட்க' +
        '</button>' +
      '</div>' +

      collapsible('translit-' + num, 'Transliteration — ஒலிப்பெயர்ப்பு', false,
        '<pre class="an-translit">' + escPre(verse.transliteration) + '</pre>') +

      collapsible('english-' + num, 'English Translation — ஆங்கில மொழிபெயர்ப்பு', true,
        '<pre class="an-english">' + escPre(verse.english) + '</pre>') +

      collapsible('urai-' + num, 'தமிழ் உரை — Tamil Commentary', false,
        '<div class="an-urai">' + esc(verse.tamilUrai) + '</div>') +

      collapsible('alt-' + num, 'Alternative Rendering', false,
        '<pre class="an-alt">' + escPre(verse.altTranslation) + '</pre>') +

      collapsible('theme-' + num, 'Devotional Theme — பக்தி கருத்து', false,
        '<div class="an-theme">' + esc(verse.theme) + '</div>') +

      collapsible('note-' + num, 'Literary & Theological Note', false,
        '<div class="an-note">' + esc(verse.note) + '</div>');

    const prev = idx > 0 ? verses[idx - 1] : null;
    const next = idx < verses.length - 1 ? verses[idx + 1] : null;

    nav.innerHTML =
      '<a href="' + (prev ? 'pasuram.html?n=' + prev.num : '#') + '" class="an-nav-link' + (prev ? '' : ' disabled') + '">' +
        '<div class="an-nav-dir">← முந்தைய · Previous</div>' +
        (prev
          ? '<div class="an-nav-gaze">' + esc(gazeLabels[idx-1] || '') + '</div>' +
            '<div class="an-nav-incipit">' + esc(prev.incipit) + '</div>' +
            '<div class="an-nav-tamil">' + esc(prev.tamil.split('\n')[0]) + '</div>'
          : '<div class="an-nav-tamil">—</div>') +
      '</a>' +
      '<a href="' + (next ? 'pasuram.html?n=' + next.num : '#') + '" class="an-nav-link next' + (next ? '' : ' disabled') + '">' +
        '<div class="an-nav-dir">அடுத்தது · Next →</div>' +
        (next
          ? '<div class="an-nav-gaze">' + esc(gazeLabels[idx+1] || '') + '</div>' +
            '<div class="an-nav-incipit">' + esc(next.incipit) + '</div>' +
            '<div class="an-nav-tamil">' + esc(next.tamil.split('\n')[0]) + '</div>'
          : '<div class="an-nav-tamil">—</div>') +
      '</a>';

    document.querySelectorAll('.an-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const open = target.classList.contains('open');
        target.classList.toggle('open', !open);
        btn.classList.toggle('open', !open);
      });
    });

    function collapsible(id, label, startOpen, bodyHtml) {
      return '<div class="an-collapsible">' +
        '<button class="an-toggle' + (startOpen ? ' open' : '') + '" data-target="' + id + '">' +
          '<span>' + label + '</span><span class="arrow">▾</span>' +
        '</button>' +
        '<div class="an-panel-body' + (startOpen ? ' open' : '') + '" id="' + id + '">' +
          bodyHtml +
        '</div>' +
      '</div>';
    }
  })();

  function speakTamil(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('ta')) || voices.find(v => v.lang.startsWith('en-IN'));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'ta-IN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>

</body>
</html>
