<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">விருத்தம் · திருச்சந்த விருத்தம்</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/tiruchanda.css"/>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark" style="color:var(--tcv-saffron,#9b4400)">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"
               fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="20" r="10" stroke-width="1.3" opacity="0.5"/>
            <circle cx="20" cy="20" r="4" fill="currentColor" opacity="0.8" stroke="none"/>
            <line x1="20" y1="8" x2="20" y2="32" stroke-width="1.2" opacity="0.5"/>
            <line x1="8" y1="20" x2="32" y2="20" stroke-width="1.2" opacity="0.5"/>
            <line x1="11.5" y1="11.5" x2="28.5" y2="28.5" stroke-width="1.2" opacity="0.4"/>
            <line x1="28.5" y1="11.5" x2="11.5" y2="28.5" stroke-width="1.2" opacity="0.4"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil" style="color:var(--tcv-saffron,#9b4400)">திருச்சந்த விருத்தம்</span>
          <span class="wordmark-english">Tiruchanda Viruttam</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Verses</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="tcv-pasuram-page">
      <nav class="tcv-bc" id="bc"></nav>
      <div class="tcv-progress" id="progress"></div>
      <div id="metre-badge"></div>
      <div class="tcv-verse-card" id="verse-card"></div>
      <nav class="tcv-nav" id="verse-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(155,68,0,0.15);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--tcv-saffron,#9b4400);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>திருச்சந்த விருத்தம் · <a href="../index.html" style="color:var(--tcv-saffron,#9b4400)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/verses.js"></script>
  <script>
  (function(){
    const { verses } = window.TCV_DATA;
    const params = new URLSearchParams(window.location.search);
    const num    = parseInt(params.get('n'), 10) || 1;
    const verse  = verses.find(v => v.num === num);
    const card   = document.getElementById('verse-card');
    const nav    = document.getElementById('verse-nav');
    const bc     = document.getElementById('bc');

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    if (!verse) {
      card.innerHTML = '<p style="text-align:center;padding:2rem">Verse not found. <a href="index.html" style="color:var(--tcv-saffron)">Return →</a></p>';
      return;
    }

    const idx = verses.findIndex(v => v.num === num);

    document.getElementById('page-title').textContent =
      'Verse ' + verse.num + ' · ' + verse.incipit + ' · திருச்சந்த விருத்தம்';

    bc.innerHTML =
      '<a href="../index.html">Library</a><span class="sep"> › </span>' +
      '<a href="index.html">Tiruchanda Viruttam</a><span class="sep"> › </span>' +
      '<span>Verse ' + verse.num + '</span>';

    // Metre badge
    document.getElementById('metre-badge').innerHTML =
      '<div class="tcv-metre-badge">✦ Viruttam · விருத்தம் · Verse ' + verse.num + ' of 96</div>';

    // Progress dots (96)
    const prog = document.getElementById('progress');
    verses.forEach((v, i) => {
      const dot = document.createElement('div');
      dot.className = 'tcv-progress-dot' + (i === idx ? ' active' : i < idx ? ' visited' : '');
      dot.title = 'Verse ' + v.num + ' — ' + v.incipit;
      dot.style.cursor = 'pointer';
      dot.addEventListener('click', () => { window.location.href = 'pasuram.html?n=' + v.num; });
      prog.appendChild(dot);
    });

    card.innerHTML =
      '<div class="tcv-verse-num">திருச்சந்த விருத்தம் · Verse ' + verse.num + ' of 96</div>' +
      '<div class="tcv-incipit">' + esc(verse.incipit) + '</div>' +

      '<div class="tcv-tamil-panel">' +
        '<div class="tcv-panel-label">Tamil · தமிழ்</div>' +
        '<pre class="tcv-tamil-text">' + escPre(verse.tamil) + '</pre>' +
        '<button class="tcv-listen-btn" onclick="speakTamil(' + JSON.stringify(verse.tamil) + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          'Listen · கேட்க' +
        '</button>' +
      '</div>' +

      collapsible('translit-' + num, 'Transliteration — ஒலிப்பெயர்ப்பு', false,
        '<pre class="tcv-translit">' + escPre(verse.transliteration) + '</pre>') +
      collapsible('english-' + num, 'English Translation — ஆங்கில மொழிபெயர்ப்பு', true,
        '<pre class="tcv-english">' + escPre(verse.english) + '</pre>') +
      collapsible('urai-' + num, 'தமிழ் உரை — Tamil Commentary', false,
        '<div class="tcv-urai">' + esc(verse.tamilUrai) + '</div>') +
      collapsible('alt-' + num, 'Alternative Rendering', false,
        '<pre class="tcv-alt">' + escPre(verse.altTranslation) + '</pre>') +
      collapsible('theme-' + num, 'Devotional Theme — பக்தி கருத்து', false,
        '<div class="tcv-theme">' + esc(verse.theme) + '</div>') +
      collapsible('note-' + num, 'Literary & Theological Note', false,
        '<div class="tcv-note">' + esc(verse.note) + '</div>');

    const prev = idx > 0 ? verses[idx - 1] : null;
    const next = idx < verses.length - 1 ? verses[idx + 1] : null;

    nav.innerHTML =
      '<a href="' + (prev ? 'pasuram.html?n=' + prev.num : '#') + '" class="tcv-nav-link' + (prev ? '' : ' disabled') + '">' +
        '<div class="tcv-nav-dir">← முந்தைய · Previous</div>' +
        (prev
          ? '<div class="tcv-nav-incipit">' + esc(prev.incipit) + '</div>' +
            '<div class="tcv-nav-tamil">' + esc(prev.tamil.split('\n')[0]) + '</div>'
          : '<div class="tcv-nav-tamil">—</div>') +
      '</a>' +
      '<a href="' + (next ? 'pasuram.html?n=' + next.num : '#') + '" class="tcv-nav-link next' + (next ? '' : ' disabled') + '">' +
        '<div class="tcv-nav-dir">அடுத்தது · Next →</div>' +
        (next
          ? '<div class="tcv-nav-incipit">' + esc(next.incipit) + '</div>' +
            '<div class="tcv-nav-tamil">' + esc(next.tamil.split('\n')[0]) + '</div>'
          : '<div class="tcv-nav-tamil">—</div>') +
      '</a>';

    document.querySelectorAll('.tcv-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const open = target.classList.contains('open');
        target.classList.toggle('open', !open);
        btn.classList.toggle('open', !open);
      });
    });

    function collapsible(id, label, startOpen, bodyHtml) {
      return '<div class="tcv-collapsible">' +
        '<button class="tcv-toggle' + (startOpen ? ' open' : '') + '" data-target="' + id + '">' +
          '<span>' + label + '</span><span class="arrow">▾</span>' +
        '</button>' +
        '<div class="tcv-panel-body' + (startOpen ? ' open' : '') + '" id="' + id + '">' +
          bodyHtml +
        '</div>' +
      '</div>';
    }
  })();

  function speakTamil(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('ta')) || voices.find(v => v.lang.startsWith('en-IN'));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'ta-IN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>

</body>
</html>
