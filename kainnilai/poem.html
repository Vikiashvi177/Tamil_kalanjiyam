<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Poem · கைந்நிலை</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/kainnilai.css" />
  <style>
    .poem-page {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .poem-breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--ink-muted);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      flex-wrap: wrap;
    }
    .poem-breadcrumb a { color: var(--ink-secondary); text-decoration: none; }
    .poem-breadcrumb a:hover { color: var(--tm-forest, #1e4228); }
    .poem-breadcrumb .sep { opacity: 0.5; }

    /* Thinai banner */
    .thinai-banner {
      padding: 1rem 1.5rem;
      border-radius: 4px;
      color: white;
      margin-bottom: 1rem;
      text-align: center;
    }
    .thinai-banner[data-thinai="kurinji"] { background: linear-gradient(135deg, #2a5c2a, #1e4c1e); }
    .thinai-banner[data-thinai="mullai"]  { background: linear-gradient(135deg, #1a4858, #0e3848); }
    .thinai-banner[data-thinai="marutam"] { background: linear-gradient(135deg, #7a4818, #6a3c0e); }
    .thinai-banner[data-thinai="neytal"]  { background: linear-gradient(135deg, #1a4870, #0e3860); }
    .thinai-banner[data-thinai="palai"]   { background: linear-gradient(135deg, #703018, #602010); }
    .thinai-banner-tamil {
      font-family: var(--font-tamil);
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .thinai-banner-eng {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      opacity: 0.95;
      margin-top: 0.2rem;
    }

    /* Metadata strip */
    .poem-metadata {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: rgba(30, 66, 40, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      margin-bottom: 2rem;
    }
    .meta-item { font-size: 0.85rem; line-height: 1.5; }
    .meta-label {
      font-family: var(--font-display);
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--tm-river, #7a5218);
      margin-bottom: 0.25rem;
      font-weight: 500;
    }
    .meta-value-tamil {
      font-family: var(--font-tamil);
      font-size: 1rem;
      color: var(--ink-primary);
      font-weight: 500;
      line-height: 1.4;
    }
    .meta-value-english {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.4;
      margin-top: 0.1rem;
    }

    /* Main poem palm-leaf card */
    .poem-card {
      position: relative;
      background: var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(43, 22, 7, 0) 0%, rgba(43, 22, 7, 0.04) 50%, rgba(43, 22, 7, 0) 100%),
        repeating-linear-gradient(0deg,
          rgba(30, 66, 40, 0.025) 0px, rgba(30, 66, 40, 0.025) 1px,
          transparent 1px, transparent 8px);
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      padding: 3rem 3rem 2.5rem;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
    }
    .poem-card::before, .poem-card::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 1.5px solid var(--border-strong);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .poem-card::before { left: 14px; }
    .poem-card::after { right: 14px; }

    /* ── Paper-card text overrides: dark ink on cream background ── */
    .poem-card .poem-layer-label   { color: #7a5010 !important; }
    .poem-card .poem-tamil-text    { color: #1a0c04 !important; }
    .poem-card .poem-translit-text { color: #3a2010 !important; }
    .poem-card .poem-english-text  { color: #1a0c04 !important; }
    .poem-card .poem-urai-text     { color: #3a2010 !important; }
    .poem-card .poem-alt-text      { color: #3a2010 !important; }
    .poem-card .poem-note          { color: #5a3010 !important; }
    .poem-card .poem-number-badge  { color: #7a5010 !important; }
    .poem-card .meta-value-tamil   { color: #1a0c04 !important; }
    .poem-card .meta-value-english { color: #3a2010 !important; }

    .poem-number-badge {
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--tm-moss, #4a7a3a);
      margin-bottom: 0.5rem;
    }
    .poem-number-badge .num {
      display: inline-block;
      font-size: 1.5rem;
      letter-spacing: 0;
      color: var(--tm-forest, #1e4228);
      font-weight: 700;
      margin: 0 0.4em;
      vertical-align: middle;
    }

    .poem-layer {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .poem-layer:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .poem-layer-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--tm-river, #7a5218);
      margin-bottom: 0.85rem;
      font-weight: 500;
    }

    .poem-tamil-text {
      font-family: var(--font-tamil);
      font-size: 1.4rem;
      line-height: 1.8;
      color: var(--ink-primary);
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: pre-line;
    }

    .poem-translit-text {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ink-secondary);
      letter-spacing: 0.01em;
      white-space: pre-line;
    }

    .poem-english-text {
      font-family: var(--font-display);
      font-size: 1.15rem;
      line-height: 1.75;
      color: var(--ink-primary);
      white-space: pre-line;
    }

    .poem-urai-text {
      font-family: var(--font-tamil);
      font-size: 1rem;
      line-height: 1.85;
      color: var(--ink-secondary);
    }

    .poem-alt-text {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--ink-secondary);
      white-space: pre-line;
    }

    .poem-note {
      background: rgba(30, 66, 40, 0.04);
      padding: 1rem 1.25rem;
      border-left: 3px solid var(--tm-river, #7a5218);
      border-radius: 2px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink-secondary);
    }

    /* Prev/Next */
    .poem-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .poem-nav-link {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--bg-paper);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .poem-nav-link:hover { border-color: var(--tm-forest, #1e4228); transform: translateY(-2px); box-shadow: var(--shadow-paper); }
    .poem-nav-link.next { text-align: right; }
    .poem-nav-link.disabled { opacity: 0.35; pointer-events: none; }
    .poem-nav-direction {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.35rem;
    }
    .poem-nav-speaker {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--tm-forest, #1e4228);
    }
    .poem-nav-num {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--ink-secondary);
      margin-top: 0.25rem;
    }

    @media (max-width: 640px) {
      .poem-card { padding: 2rem 1.25rem; }
      .poem-tamil-text { font-size: 1.15rem; }
      .poem-nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 20 5 L 14 16 L 26 16 Z" fill="currentColor" opacity="0.75" stroke="none"/>
            <path d="M 8 20 Q 14 14 20 18 Q 14 22 8 20 Z" fill="currentColor" opacity="0.65" stroke="none"/>
            <path d="M 10 28 Q 15 24 20 26 Q 25 28 30 25" stroke-width="1.5" opacity="0.7"/>
            <path d="M 8 34 Q 14 31 20 33 Q 26 35 32 32" stroke-width="1.3" opacity="0.55"/>
            <circle cx="30" cy="14" r="4" stroke-width="1.2" opacity="0.65"/>
            <path d="M 30 8 L 30 6" stroke-width="1.2" opacity="0.5"/>
            <path d="M 35 9 L 36.5 7.5" stroke-width="1.2" opacity="0.5"/>
            <path d="M 36 14 L 38 14" stroke-width="1.2" opacity="0.5"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">கைந்நிலை</span>
          <span class="wordmark-english">Kainnilai</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Poems</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="poem-page">

      <nav class="poem-breadcrumb">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Kainnilai</a>
        <span class="sep">›</span>
        <span id="bc-poem">…</span>
      </nav>

      <div id="poem-container"></div>

      <nav class="poem-nav" id="poem-nav"></nav>

    </article>
  </main>

  <script src="data/poems.js"></script>
  <script>
    (function() {
      // Robust data loading — try DATA.poems first, fall back to array
      let poemsList;
      try {
        const dataObj = window.KAINNILAI_DATA;
        if (dataObj && Array.isArray(dataObj.poems) && dataObj.poems.length > 0) {
          poemsList = dataObj.poems;
        } else if (window.KAINNILAI_POEMS && Array.isArray(window.KAINNILAI_POEMS)) {
          poemsList = window.KAINNILAI_POEMS;
        } else {
          throw new Error('KAINNILAI_DATA.poems and KAINNILAI_POEMS both unavailable');
        }
      } catch(e) {
        document.getElementById('poem-container').innerHTML =
          '<div style="padding:2rem;text-align:center;color:var(--ink-secondary);">' +
          '<p>Error loading poem data: ' + e.message + '</p>' +
          '<a href="index.html">← Back to all poems</a></div>';
        document.getElementById('bc-poem').textContent = 'Error';
        throw e;
      }
      const poemsByNum = new Map(poemsList.map(p => [p.num, p]));
      const params = new URLSearchParams(window.location.search);
      const num = parseInt(params.get('n'), 10) || 1;

      function thinaiSlug(thinai) {
        if (!thinai) return '';
        if (thinai.includes('குறிஞ்சி')) return 'kurinji';
        if (thinai.includes('முல்லை'))   return 'mullai';
        if (thinai.includes('மருதம்'))   return 'marutam';
        if (thinai.includes('நெய்தல்'))  return 'neytal';
        if (thinai.includes('பாலை'))     return 'palai';
        return '';
      }

      const poem = poemsByNum.get(num);
      const container = document.getElementById('poem-container');

      if (!poem) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 2rem; background: var(--bg-paper); border: 1px solid var(--border-subtle); border-radius: 4px;">
            <p style="font-family: var(--font-display); color: var(--ink-secondary); font-size: 1.1rem; margin-bottom: 1rem;">
              பாடல் ${num} இன்னும் தயாராகவில்லை · Poem ${num} is not yet available.
            </p>
            <a href="index.html" style="display: inline-block; margin-top: 1.5rem; color: var(--kn-amber,#b87a18); text-decoration: none; font-family: var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85rem;">← Back to all poems</a>
          </div>
        `;
        document.getElementById('bc-poem').textContent = `பாடல் ${num}`;
        document.getElementById('page-title').textContent = `பாடல் ${num} · கைந்நிலை`;
        return;
      }

      document.getElementById('page-title').textContent = `பாடல் ${poem.num} · ${poem.speakerEnglish} · கைந்நிலை`;
      document.getElementById('bc-poem').textContent = `பாடல் ${poem.num} · Poem ${poem.num}`;

      const slug = thinaiSlug(poem.thinai);

      container.innerHTML = `
        <div class="thinai-banner" data-thinai="${slug}">
          <div class="thinai-banner-tamil">${poem.thinai}</div>
          <div class="thinai-banner-eng">${poem.thinaiEnglish}</div>
        </div>

        <div class="poem-metadata">
          <div class="meta-item">
            <div class="meta-label">புலவர் · Poet</div>
            <div class="meta-value-tamil">${poem.poet}</div>
            <div class="meta-value-english">${poem.poetEnglish}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">கூற்றுச் சார்பு · Speaker</div>
            <div class="meta-value-tamil">${poem.speaker}</div>
            <div class="meta-value-english">${poem.speakerEnglish}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">துறை · Situation</div>
            <div class="meta-value-tamil">${poem.turai}</div>
            <div class="meta-value-english">${poem.turaiEnglish}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">திணை · Landscape</div>
            <div class="meta-value-tamil">${poem.thinai}</div>
            <div class="meta-value-english">${poem.thinaiEnglish}</div>
          </div>
        </div>

        <div class="poem-card">
          <div class="poem-number-badge">Kainnilai <span class="num">${poem.num}</span> of 50</div>

          <div class="poem-layer">
            <div class="poem-layer-label">Tamil · தமிழ்</div>
            <div class="poem-tamil-text">${escapeHtml(poem.tamil)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Transliteration</div>
            <div class="poem-translit-text">${escapeHtml(poem.transliteration)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">English Translation</div>
            <div class="poem-english-text">${escapeHtml(poem.english)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Tamil Commentary · உரை</div>
            <div class="poem-urai-text">${escapeHtml(poem.tamilUrai)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Alternative Rendering</div>
            <div class="poem-alt-text">${escapeHtml(poem.altTranslation)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Literary Note</div>
            <div class="poem-note">${escapeHtml(poem.note)}</div>
          </div>
        </div>
      `;

      const prev = poemsByNum.has(num - 1) ? poemsByNum.get(num - 1) : null;
      const next = poemsByNum.has(num + 1) ? poemsByNum.get(num + 1) : null;

      document.getElementById('poem-nav').innerHTML = `
        <a href="${prev ? `poem.html?n=${prev.num}` : '#'}"
           class="poem-nav-link ${prev ? '' : 'disabled'}">
          <div class="poem-nav-direction">← முந்தைய · Previous</div>
          <div class="poem-nav-speaker">${prev ? prev.speakerEnglish : '—'}</div>
          <div class="poem-nav-num">${prev ? `பாடல் ${prev.num} · ${prev.thinaiEnglish.split('(')[0].trim()}` : ''}</div>
        </a>
        <a href="${next ? `poem.html?n=${next.num}` : '#'}"
           class="poem-nav-link next ${next ? '' : 'disabled'}">
          <div class="poem-nav-direction">அடுத்தது · Next →</div>
          <div class="poem-nav-speaker">${next ? next.speakerEnglish : '—'}</div>
          <div class="poem-nav-num">${next ? `பாடல் ${next.num} · ${next.thinaiEnglish.split('(')[0].trim()}` : ''}</div>
        </a>
      `;
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>

</body>
</html>
