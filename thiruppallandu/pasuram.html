<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பாசுரம் · திருப்பல்லாண்டு</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/pallandu.css"/>
  <style>
    :root {
      --tp-gold:        #7b4f00;
      --tp-gold-mid:    #9b6a10;
      --tp-gold-pale:   rgba(123,79,0,.08);
      --tp-gold-pale2:  rgba(123,79,0,.14);
      --tp-amber:       #5c3800;
      --tp-flame:       #7b4f00;
      --tp-flame-mid:   #9b6a10;
      --tp-flame-pale:  rgba(123,79,0,.08);
      --tp-flame-pale2: rgba(123,79,0,.14);
    }

    .tp-pasuram-page { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .tp-bc {
      display: flex; align-items: center; gap: .5rem;
      font-size: .875rem; color: var(--ink-muted);
      margin-bottom: 2rem; letter-spacing: .04em; flex-wrap: wrap;
    }
    .tp-bc a { color: var(--ink-secondary); text-decoration: none; }
    .tp-bc a:hover { color: var(--tp-gold); }
    .tp-bc .sep { opacity: .45; }

    /* Palm-leaf card */
    .tp-pasuram-card {
      position: relative;
      background: var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(123,79,0,0) 0%, rgba(123,79,0,.03) 50%, rgba(123,79,0,0) 100%),
        repeating-linear-gradient(0deg,
          rgba(123,79,0,.02) 0px, rgba(123,79,0,.02) 1px,
          transparent 1px, transparent 8px);
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      padding: 3.5rem 3rem;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
    }
    .tp-pasuram-card::before,
    .tp-pasuram-card::after {
      content:''; position:absolute; top:50%; transform:translateY(-50%);
      width:14px; height:14px; border-radius:50%;
      background:var(--bg-primary); border:1.5px solid var(--border-strong);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
    }
    .tp-pasuram-card::before { left:14px; }
    .tp-pasuram-card::after  { right:14px; }

    .tp-pasuram-num {
      text-align:center; font-family:var(--font-display);
      font-size:.78rem; letter-spacing:.28em; text-transform:uppercase;
      color:var(--tp-gold); margin-bottom:.3rem;
    }
    .tp-incipit {
      text-align:center; font-family:var(--font-display);
      font-style:italic; font-size:1rem; color:var(--tp-gold);
      margin-bottom:2rem; letter-spacing:.03em;
    }

    .tp-panel-label {
      font-family:var(--font-display); font-size:.72rem;
      letter-spacing:.25em; text-transform:uppercase;
      color:var(--tp-gold); margin-bottom:.65rem; font-weight:500;
    }
    .tp-tamil-panel {
      margin-bottom:1.75rem; padding-bottom:1.75rem;
      border-bottom:1px solid var(--border-subtle);
    }
    .tp-tamil-text {
      font-family:var(--font-tamil); font-size:1.875rem;
      line-height:1.65; color:var(--ink-primary); font-weight:600;
      white-space:pre-line; margin:0;
    }
    .tp-listen-btn {
      display:inline-flex; align-items:center; gap:.45rem;
      margin-top:.85rem; padding:.45rem .9rem;
      background:rgba(123,79,0,.08); border:1px solid var(--tp-gold);
      border-radius:20px; color:var(--tp-gold);
      font-family:var(--font-display); font-size:.8rem;
      letter-spacing:.1em; text-transform:uppercase;
      cursor:pointer; transition:all .15s;
    }
    .tp-listen-btn:hover { background:var(--tp-gold); color:var(--bg-paper); }

    .tp-collapsible {
      background:var(--bg-paper); border:1px solid rgba(123,79,0,.2);
      border-radius:4px; margin-bottom:.75rem; overflow:hidden;
    }
    .tp-toggle {
      width:100%; text-align:left; background:none; border:none;
      cursor:pointer; padding:1rem 1.5rem;
      font-family:var(--font-display); font-size:.9rem;
      color:var(--ink-secondary); display:flex; align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(123,79,0,.12); transition:background .12s;
    }
    .tp-toggle:hover { background:rgba(123,79,0,.08); }
    .tp-toggle .arrow { font-size:.75rem; transition:transform .2s; color:var(--tp-gold); }
    .tp-toggle.open .arrow { transform:rotate(180deg); }
    .tp-panel-body { padding:1.2rem 1.5rem 1.4rem; display:none; }
    .tp-panel-body.open { display:block; }

    .tp-translit { font-family:var(--font-body); font-style:italic; font-size:1.15rem; line-height:1.65; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .tp-english  { font-family:var(--font-display); font-size:1.25rem; font-style:italic; line-height:1.65; color:var(--ink-primary); white-space:pre-line; margin:0; }
    .tp-urai     { font-family:var(--font-tamil); font-size:1.0625rem; line-height:1.85; color:var(--ink-secondary); }
    .tp-alt      { font-family:var(--font-display); font-style:italic; font-size:1.1rem; line-height:1.7; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .tp-theme    { font-family:var(--font-body); font-size:.975rem; line-height:1.75; color:var(--ink-secondary); }
    .tp-note     { font-family:var(--font-body); font-size:.975rem; line-height:1.8; color:var(--ink-secondary); }

    .tp-nav {
      display:grid; grid-template-columns:1fr 1fr;
      gap:1rem; margin-top:2.5rem;
    }
    .tp-nav-link {
      display:block; padding:1.2rem 1.4rem;
      background:var(--bg-paper); border:1px solid var(--border-subtle);
      border-radius:4px; text-decoration:none; color:inherit;
      transition:all .2s ease;
    }
    .tp-nav-link:hover { border-color:var(--tp-gold); transform:translateY(-2px); box-shadow:var(--shadow-paper); }
    .tp-nav-link.next { text-align:right; }
    .tp-nav-link.disabled { opacity:.35; pointer-events:none; }
    .tp-nav-dir { font-family:var(--font-display); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.35rem; }
    .tp-nav-incipit { font-family:var(--font-display); font-style:italic; font-size:.85rem; color:var(--tp-gold); margin-bottom:.2rem; }
    .tp-nav-tamil { font-family:var(--font-tamil); font-size:.95rem; color:var(--ink-primary); line-height:1.4; }

    @media (max-width:640px) {
      .tp-pasuram-card { padding:2.5rem 1.5rem; }
      .tp-tamil-text   { font-size:1.5rem; }
      .tp-nav          { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark" style="color:var(--tp-gold,#7b4f00)">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M 8 28 L 32 28 L 30 18 L 24 24 L 20 14 L 16 24 L 10 18 Z"
                  fill="currentColor" opacity=".75" stroke="none"/>
            <circle cx="20" cy="14" r="2" fill="currentColor" opacity=".95" stroke="none"/>
            <circle cx="10" cy="18" r="1.5" fill="currentColor" opacity=".7" stroke="none"/>
            <circle cx="30" cy="18" r="1.5" fill="currentColor" opacity=".7" stroke="none"/>
            <rect x="7" y="28" width="26" height="3" rx="1.5"
                  fill="currentColor" opacity=".6" stroke="none"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil" style="color:var(--tp-gold,#7b4f00)">திருப்பல்லாண்டு</span>
          <span class="wordmark-english">Thiruppallāṇḍu</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Pāsurams</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="tp-pasuram-page">
      <nav class="tp-bc" id="bc"></nav>
      <div class="tp-pasuram-card" id="pasuram-card"></div>
      <nav class="tp-nav" id="pasuram-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(123,79,0,.15);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--tp-gold,#7b4f00);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>திருப்பல்லாண்டு · <a href="../index.html" style="color:var(--tp-gold,#7b4f00)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/verses.js"></script>
  <script>
  (function(){
    const { verses } = window.TP_DATA;
    const params  = new URLSearchParams(window.location.search);
    const num     = parseInt(params.get('n'), 10) || 1;
    const verse   = verses.find(v => v.num === num);
    const card    = document.getElementById('pasuram-card');
    const nav     = document.getElementById('pasuram-nav');
    const bc      = document.getElementById('bc');

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    if (!verse) {
      card.innerHTML = '<p style="text-align:center;padding:2rem">Pāsuram not found. <a href="index.html" style="color:var(--tp-gold)">Return →</a></p>';
      return;
    }

    document.getElementById('page-title').textContent =
      'Pāsuram ' + verse.num + ' · ' + verse.incipit + ' · திருப்பல்லாண்டு';

    // Breadcrumb
    bc.innerHTML =
      '<a href="../index.html">Library</a><span class="sep"> › </span>' +
      '<a href="index.html">Thiruppallāṇḍu</a><span class="sep"> › </span>' +
      '<span>Pāsuram ' + verse.num + '</span>';

    // Main card
    card.innerHTML =
      '<div class="tp-pasuram-num">திருப்பல்லாண்டு · Pāsuram ' + verse.num + ' of 12</div>' +
      '<div class="tp-incipit">' + esc(verse.incipit) + '</div>' +

      '<div class="tp-tamil-panel">' +
        '<div class="tp-panel-label">Tamil · தமிழ்</div>' +
        '<pre class="tp-tamil-text">' + escPre(verse.tamil) + '</pre>' +
        '<button class="tp-listen-btn" onclick="speakTamil(' + JSON.stringify(verse.tamil) + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          'Listen · கேட்க' +
        '</button>' +
      '</div>' +

      collapsible('translit-' + num, 'Transliteration — ஒலிப்பெயர்ப்பு', false,
        '<pre class="tp-translit">' + escPre(verse.transliteration) + '</pre>') +

      collapsible('english-' + num, 'English Translation — ஆங்கில மொழிபெயர்ப்பு', true,
        '<pre class="tp-english">' + escPre(verse.english) + '</pre>') +

      collapsible('urai-' + num, 'தமிழ் உரை — Tamil Commentary', false,
        '<div class="tp-urai">' + esc(verse.tamilUrai) + '</div>') +

      collapsible('alt-' + num, 'Alternative Rendering', false,
        '<pre class="tp-alt">' + escPre(verse.altTranslation) + '</pre>') +

      collapsible('theme-' + num, 'Devotional Theme — பக்தி கருத்து', false,
        '<div class="tp-theme">' + esc(verse.theme) + '</div>') +

      collapsible('note-' + num, 'Literary & Theological Note', false,
        '<div class="tp-note">' + esc(verse.note) + '</div>');

    const idx  = verses.findIndex(v => v.num === num);
    const prev = idx > 0 ? verses[idx - 1] : null;
    const next = idx < verses.length - 1 ? verses[idx + 1] : null;

    nav.innerHTML =
      '<a href="' + (prev ? 'pasuram.html?n=' + prev.num : '#') + '" class="tp-nav-link' + (prev ? '' : ' disabled') + '">' +
        '<div class="tp-nav-dir">← முந்தைய · Previous</div>' +
        (prev ? '<div class="tp-nav-incipit">' + esc(prev.incipit) + '</div><div class="tp-nav-tamil">' + esc(prev.tamil.split('\n')[0]) + '</div>' : '<div class="tp-nav-tamil">—</div>') +
      '</a>' +
      '<a href="' + (next ? 'pasuram.html?n=' + next.num : '#') + '" class="tp-nav-link next' + (next ? '' : ' disabled') + '">' +
        '<div class="tp-nav-dir">அடுத்தது · Next →</div>' +
        (next ? '<div class="tp-nav-incipit">' + esc(next.incipit) + '</div><div class="tp-nav-tamil">' + esc(next.tamil.split('\n')[0]) + '</div>' : '<div class="tp-nav-tamil">—</div>') +
      '</a>';

    document.querySelectorAll('.tp-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const open = target.classList.contains('open');
        target.classList.toggle('open', !open);
        btn.classList.toggle('open', !open);
      });
    });

    function collapsible(id, label, startOpen, bodyHtml) {
      return '<div class="tp-collapsible">' +
        '<button class="tp-toggle' + (startOpen ? ' open' : '') + '" data-target="' + id + '">' +
          '<span>' + label + '</span><span class="arrow">▾</span>' +
        '</button>' +
        '<div class="tp-panel-body' + (startOpen ? ' open' : '') + '" id="' + id + '">' +
          bodyHtml +
        '</div>' +
      '</div>';
    }
  })();

  function speakTamil(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('ta')) || voices.find(v => v.lang.startsWith('en-IN'));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'ta-IN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>

</body>
</html>
