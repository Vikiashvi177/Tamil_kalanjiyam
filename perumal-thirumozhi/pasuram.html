<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பாசுரம் · பெருமாள் திருமொழி</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/perumal.css"/>
  <style>
    :root {
      --pt-teal:#0d4a4a; --pt-teal-mid:#1a6b6b;
      --pt-teal-pale:rgba(13,74,74,.08); --pt-teal-pale2:rgba(13,74,74,.14);
      --tp-flame:#0d4a4a; --tp-flame-mid:#1a6b6b;
      --tp-flame-pale:rgba(13,74,74,.08); --tp-flame-pale2:rgba(13,74,74,.14);
      --tp-gold:#0d4a4a;
    }
    .pt-page { max-width:780px; margin:0 auto; padding:2rem 1.5rem 4rem; }
    .pt-bc { display:flex; align-items:center; gap:.5rem; font-size:.875rem; color:var(--ink-muted); margin-bottom:2rem; letter-spacing:.04em; flex-wrap:wrap; }
    .pt-bc a { color:var(--ink-secondary); text-decoration:none; }
    .pt-bc a:hover { color:var(--pt-teal); }
    .pt-bc .sep { opacity:.45; }
    .pt-progress { display:flex; height:4px; border-radius:3px; overflow:hidden; margin-bottom:1.5rem; gap:1px; }
    .pt-prog-seg { flex:1; border-radius:1px; background:rgba(13,74,74,.15); transition:background .2s; }
    .pt-prog-seg.active { background:var(--pt-teal); }
    .pt-prog-seg.visited { background:rgba(13,74,74,.4); }
    .pt-decad-badge { display:inline-flex; align-items:center; gap:.45rem; background:rgba(13,74,74,.07); border:1px solid rgba(13,74,74,.22); border-radius:20px; padding:.3rem .85rem; font-family:var(--font-display); font-size:.75rem; color:var(--pt-teal); letter-spacing:.1em; margin-bottom:1rem; }
    .pt-card { position:relative; background:var(--bg-paper); background-image:linear-gradient(180deg,rgba(13,74,74,0) 0%,rgba(13,74,74,.025) 50%,rgba(13,74,74,0) 100%),repeating-linear-gradient(0deg,rgba(13,74,74,.02) 0px,rgba(13,74,74,.02) 1px,transparent 1px,transparent 8px); border:1px solid var(--border-medium); border-radius:4px; padding:3.5rem 3rem; box-shadow:var(--shadow-paper); overflow:hidden; }
    .pt-card::before,.pt-card::after { content:''; position:absolute; top:50%; transform:translateY(-50%); width:14px; height:14px; border-radius:50%; background:var(--bg-primary); border:1.5px solid var(--border-strong); box-shadow:inset 0 1px 2px rgba(0,0,0,.3); }
    .pt-card::before { left:14px; } .pt-card::after { right:14px; }
    .pt-card-num { text-align:center; font-family:var(--font-display); font-size:.78rem; letter-spacing:.28em; text-transform:uppercase; color:var(--pt-teal); margin-bottom:.3rem; }
    .pt-incipit { text-align:center; font-family:var(--font-display); font-style:italic; font-size:1rem; color:var(--pt-teal); margin-bottom:2rem; }
    .pt-panel-label { font-family:var(--font-display); font-size:.72rem; letter-spacing:.25em; text-transform:uppercase; color:var(--pt-teal); margin-bottom:.65rem; font-weight:500; }
    .pt-tamil-panel { margin-bottom:1.75rem; padding-bottom:1.75rem; border-bottom:1px solid var(--border-subtle); }
    .pt-tamil-text { font-family:var(--font-tamil); font-size:1.875rem; line-height:1.65; color:var(--ink-primary); font-weight:600; white-space:pre-line; margin:0; }
    .pt-listen-btn { display:inline-flex; align-items:center; gap:.45rem; margin-top:.85rem; padding:.45rem .9rem; background:rgba(13,74,74,.07); border:1px solid var(--pt-teal); border-radius:20px; color:var(--pt-teal); font-family:var(--font-display); font-size:.8rem; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; transition:all .15s; }
    .pt-listen-btn:hover { background:var(--pt-teal); color:var(--bg-paper); }
    .pt-collapsible { background:var(--bg-paper); border:1px solid rgba(13,74,74,.2); border-radius:4px; margin-bottom:.75rem; overflow:hidden; }
    .pt-toggle { width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:1rem 1.5rem; font-family:var(--font-display); font-size:.9rem; color:var(--ink-secondary); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(13,74,74,.12); transition:background .12s; }
    .pt-toggle:hover { background:rgba(13,74,74,.07); }
    .pt-toggle .arrow { font-size:.75rem; transition:transform .2s; color:var(--pt-teal); }
    .pt-toggle.open .arrow { transform:rotate(180deg); }
    .pt-panel-body { padding:1.2rem 1.5rem 1.4rem; display:none; }
    .pt-panel-body.open { display:block; }
    .pt-translit { font-family:var(--font-body); font-style:italic; font-size:1.15rem; line-height:1.65; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .pt-english { font-family:var(--font-display); font-size:1.25rem; font-style:italic; line-height:1.65; color:var(--ink-primary); white-space:pre-line; margin:0; }
    .pt-urai { font-family:var(--font-tamil); font-size:1.0625rem; line-height:1.85; color:var(--ink-secondary); }
    .pt-alt { font-family:var(--font-display); font-style:italic; font-size:1.1rem; line-height:1.7; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .pt-theme { font-family:var(--font-body); font-size:.975rem; line-height:1.75; color:var(--ink-secondary); }
    .pt-note { font-family:var(--font-body); font-size:.975rem; line-height:1.8; color:var(--ink-secondary); }
    .pt-nav { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:2.5rem; }
    .pt-nav-link { display:block; padding:1.2rem 1.4rem; background:var(--bg-paper); border:1px solid var(--border-subtle); border-radius:4px; text-decoration:none; color:inherit; transition:all .2s ease; }
    .pt-nav-link:hover { border-color:var(--pt-teal); transform:translateY(-2px); box-shadow:var(--shadow-paper); }
    .pt-nav-link.next { text-align:right; }
    .pt-nav-link.disabled { opacity:.35; pointer-events:none; }
    .pt-nav-dir { font-family:var(--font-display); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.35rem; }
    .pt-nav-sub { font-family:var(--font-display); font-size:.72rem; color:var(--pt-teal); opacity:.7; margin-bottom:.15rem; }
    .pt-nav-incipit { font-family:var(--font-display); font-style:italic; font-size:.85rem; color:var(--pt-teal); margin-bottom:.2rem; }
    .pt-nav-tamil { font-family:var(--font-tamil); font-size:.95rem; color:var(--ink-primary); line-height:1.4; }
    @media (max-width:640px) { .pt-card { padding:2.5rem 1.5rem; } .pt-tamil-text { font-size:1.5rem; } .pt-nav { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark" style="color:var(--pt-teal,#0d4a4a)">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 8 28 L 8 20 L 14 26 L 20 12 L 26 26 L 32 20 L 32 28 Z" fill="currentColor" opacity=".75" stroke="none"/>
            <path d="M 6 30 L 34 30" stroke-width="1.6" opacity=".6"/>
            <circle cx="20" cy="12" r="2.5" fill="currentColor" opacity=".9" stroke="none"/>
            <circle cx="8" cy="20" r="2" fill="currentColor" opacity=".7" stroke="none"/>
            <circle cx="32" cy="20" r="2" fill="currentColor" opacity=".7" stroke="none"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil" style="color:var(--pt-teal,#0d4a4a)">பெருமாள் திருமொழி</span>
          <span class="wordmark-english">Perumāḷ Tirumoḻi</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Pāsurams</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="pt-page">
      <nav class="pt-bc" id="bc"></nav>
      <div class="pt-progress" id="progress"></div>
      <div id="decad-badge"></div>
      <div class="pt-card" id="pasuram-card"></div>
      <nav class="pt-nav" id="pasuram-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(13,74,74,.15);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--pt-teal,#0d4a4a);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>பெருமாள் திருமொழி · <a href="../index.html" style="color:var(--pt-teal,#0d4a4a)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/verses.js"></script>
  <script>
  (function(){
    const { verses, decads } = window.PT_DATA;
    const params = new URLSearchParams(window.location.search);
    const num = parseInt(params.get('n'), 10) || 1;
    const verse = verses.find(v => v.num === num);
    const card = document.getElementById('pasuram-card');
    const nav  = document.getElementById('pasuram-nav');
    const bc   = document.getElementById('bc');

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    if (!verse) {
      card.innerHTML = '<p style="text-align:center;padding:2rem">Not found. <a href="index.html" style="color:var(--pt-teal)">Return →</a></p>';
      return;
    }

    const idx = verses.findIndex(v => v.num === num);
    const decad = decads.find(d => d.num === verse.decad);

    document.getElementById('page-title').textContent = 'Pāsuram ' + verse.num + ' · ' + verse.incipit + ' · பெருமாள் திருமொழி';

    bc.innerHTML = '<a href="../index.html">Library</a><span class="sep"> › </span>' +
      '<a href="index.html">Perumāḷ Tirumoḻi</a><span class="sep"> › </span>' +
      '<span>Pāsuram ' + verse.num + '</span>';

    // Progress bar
    const prog = document.getElementById('progress');
    verses.forEach((v, i) => {
      const seg = document.createElement('div');
      seg.className = 'pt-prog-seg' + (i === idx ? ' active' : i < idx ? ' visited' : '');
      prog.appendChild(seg);
    });

    // Decad badge
    document.getElementById('decad-badge').innerHTML =
      '<div class="pt-decad-badge">✦ Decad ' + verse.decad + (decad ? ' — ' + esc(decad.title) : '') + '</div>';

    card.innerHTML =
      '<div class="pt-card-num">பெருமாள் திருமொழி · Pāsuram ' + verse.num + ' of 105</div>' +
      '<div class="pt-incipit">' + esc(verse.incipit) + '</div>' +
      '<div class="pt-tamil-panel">' +
        '<div class="pt-panel-label">Tamil · தமிழ்</div>' +
        '<pre class="pt-tamil-text">' + escPre(verse.tamil) + '</pre>' +
        '<button class="pt-listen-btn" onclick="speakTamil(' + JSON.stringify(verse.tamil) + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          'Listen · கேட்க' +
        '</button>' +
      '</div>' +
      collapsible('translit','Transliteration — ஒலிப்பெயர்ப்பு',false,'<pre class="pt-translit">'+escPre(verse.transliteration)+'</pre>') +
      collapsible('english','English Translation — ஆங்கில மொழிபெயர்ப்பு',true,'<pre class="pt-english">'+escPre(verse.english)+'</pre>') +
      collapsible('urai','தமிழ் உரை — Tamil Commentary',false,'<div class="pt-urai">'+esc(verse.tamilUrai)+'</div>') +
      collapsible('alt','Alternative Rendering',false,'<pre class="pt-alt">'+escPre(verse.altTranslation)+'</pre>') +
      collapsible('theme','Devotional Theme — பக்தி கருத்து',false,'<div class="pt-theme">'+esc(verse.theme)+'</div>') +
      collapsible('note','Literary & Theological Note',false,'<div class="pt-note">'+esc(verse.note)+'</div>');

    const prev = idx > 0 ? verses[idx-1] : null;
    const next = idx < verses.length-1 ? verses[idx+1] : null;
    const prevD = prev ? decads.find(d=>d.num===prev.decad) : null;
    const nextD = next ? decads.find(d=>d.num===next.decad) : null;

    nav.innerHTML =
      '<a href="'+(prev?'pasuram.html?n='+prev.num:'#')+'" class="pt-nav-link'+(prev?'':' disabled')+'">' +
        '<div class="pt-nav-dir">← முந்தைய · Previous</div>' +
        (prev?'<div class="pt-nav-sub">'+esc(prevD?prevD.title:'')+'</div><div class="pt-nav-incipit">'+esc(prev.incipit)+'</div><div class="pt-nav-tamil">'+esc(prev.tamil.split('\n')[0])+'</div>':'<div class="pt-nav-tamil">—</div>') +
      '</a>' +
      '<a href="'+(next?'pasuram.html?n='+next.num:'#')+'" class="pt-nav-link next'+(next?'':' disabled')+'">' +
        '<div class="pt-nav-dir">அடுத்தது · Next →</div>' +
        (next?'<div class="pt-nav-sub">'+esc(nextD?nextD.title:'')+'</div><div class="pt-nav-incipit">'+esc(next.incipit)+'</div><div class="pt-nav-tamil">'+esc(next.tamil.split('\n')[0])+'</div>':'<div class="pt-nav-tamil">—</div>') +
      '</a>';

    document.querySelectorAll('.pt-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = document.getElementById(btn.dataset.target);
        if (!t) return;
        const open = t.classList.contains('open');
        t.classList.toggle('open', !open);
        btn.classList.toggle('open', !open);
      });
    });

    function collapsible(id, label, startOpen, body) {
      return '<div class="pt-collapsible">' +
        '<button class="pt-toggle'+(startOpen?' open':'')+'" data-target="'+id+'">' +
          '<span>'+label+'</span><span class="arrow">▾</span>' +
        '</button>' +
        '<div class="pt-panel-body'+(startOpen?' open':'')+'" id="'+id+'">'+body+'</div>' +
      '</div>';
    }
  })();

  function speakTamil(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g,' '));
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v=>v.lang.startsWith('ta'))||voices.find(v=>v.lang.startsWith('en-IN'));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'ta-IN'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>
</body>
</html>
