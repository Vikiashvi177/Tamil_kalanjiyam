<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Poem · புறநானூறு</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .poem-page {
      max-width: 820px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .poem-breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--ink-muted);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
      flex-wrap: wrap;
    }
    .poem-breadcrumb a {
      color: var(--ink-secondary);
      text-decoration: none;
    }
    .poem-breadcrumb a:hover { color: var(--accent-vermillion); }
    .poem-breadcrumb .sep { opacity: 0.5; }

    /* Metadata strip — poet, patron, situation */
    .poem-metadata {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: rgba(184, 112, 31, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      margin-bottom: 2rem;
    }
    .meta-item {
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .meta-label {
      font-family: var(--font-display);
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent-ochre);
      margin-bottom: 0.25rem;
      font-weight: 500;
    }
    .meta-value-tamil {
      font-family: var(--font-tamil);
      font-size: 1rem;
      color: var(--ink-primary);
      font-weight: 500;
      line-height: 1.4;
    }
    .meta-value-english {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.4;
      margin-top: 0.1rem;
    }

    /* Main poem card — palm-leaf */
    .poem-card {
      position: relative;
      background: var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(43, 22, 7, 0) 0%, rgba(43, 22, 7, 0.04) 50%, rgba(43, 22, 7, 0) 100%),
        repeating-linear-gradient(0deg,
          rgba(43, 22, 7, 0.025) 0px, rgba(43, 22, 7, 0.025) 1px,
          transparent 1px, transparent 8px);
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      padding: 3rem 3rem 2.5rem;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
    }
    .poem-card::before, .poem-card::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 1.5px solid var(--border-strong);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .poem-card::before { left: 14px; }
    .poem-card::after { right: 14px; }

    .poem-number-badge {
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }
    .poem-number-badge .num {
      display: inline-block;
      font-size: 1.5rem;
      letter-spacing: 0;
      color: var(--accent-vermillion);
      font-weight: 700;
      margin: 0 0.4em;
      vertical-align: middle;
    }

    /* Layer styles */
    .poem-layer {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .poem-layer:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .poem-layer-label {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-ochre);
      margin-bottom: 0.85rem;
      font-weight: 500;
    }

    .poem-tamil-text {
      font-family: var(--font-tamil);
      font-size: 1.4rem;
      line-height: 1.8;
      color: var(--ink-primary);
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: pre-line;
    }

    .poem-translit-text {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--ink-secondary);
      letter-spacing: 0.01em;
      white-space: pre-line;
    }

    .poem-english-text {
      font-family: var(--font-display);
      font-size: 1.15rem;
      line-height: 1.75;
      color: var(--ink-primary);
      white-space: pre-line;
    }

    .poem-urai-text {
      font-family: var(--font-tamil);
      font-size: 1rem;
      line-height: 1.85;
      color: var(--ink-secondary);
    }

    .poem-alt-text {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.75;
      color: var(--ink-secondary);
      white-space: pre-line;
    }

    .poem-note {
      background: rgba(43, 22, 7, 0.04);
      padding: 1rem 1.25rem;
      border-left: 3px solid var(--accent-ochre);
      border-radius: 2px;
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink-secondary);
    }

    /* Prev/Next */
    .poem-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .poem-nav-link {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--bg-paper);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .poem-nav-link:hover { border-color: var(--accent-vermillion); transform: translateY(-2px); box-shadow: var(--shadow-paper); }
    .poem-nav-link.next { text-align: right; }
    .poem-nav-link.disabled { opacity: 0.35; pointer-events: none; }
    .poem-nav-direction {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.35rem;
    }
    .poem-nav-poet {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--accent-vermillion);
    }
    .poem-nav-num {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--ink-secondary);
      margin-top: 0.25rem;
    }

    @media (max-width: 640px) {
      .poem-card { padding: 2rem 1.25rem; }
      .poem-tamil-text { font-size: 1.15rem; }
      .poem-nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="20" r="3" fill="currentColor"/>
            <path d="M 20 7 Q 24 12 20 17 Q 16 12 20 7 Z" fill="currentColor" opacity="0.85"/>
            <path d="M 20 33 Q 24 28 20 23 Q 16 28 20 33 Z" fill="currentColor" opacity="0.85"/>
            <path d="M 7 20 Q 12 24 17 20 Q 12 16 7 20 Z" fill="currentColor" opacity="0.85"/>
            <path d="M 33 20 Q 28 24 23 20 Q 28 16 33 20 Z" fill="currentColor" opacity="0.85"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">புறநானூறு</span>
          <span class="wordmark-english">Puṟanāṉūṟu</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Poems</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="poem-page">

      <nav class="poem-breadcrumb">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Puṟanāṉūṟu</a>
        <span class="sep">›</span>
        <span id="bc-poem">…</span>
      </nav>

      <div id="poem-container"></div>

      <nav class="poem-nav" id="poem-nav"></nav>

    </article>
  </main>

  <script src="data/poems.js"></script>
  <script>
    (function() {
      const data = window.PURANAANOORU_DATA;
      const poemsByNum = new Map(data.poems.map(p => [p.num, p]));
      const params = new URLSearchParams(window.location.search);
      const num = parseInt(params.get('n'), 10) || 1;

      const poem = poemsByNum.get(num);
      const container = document.getElementById('poem-container');

      if (!poem) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 2rem; background: var(--bg-paper); border: 1px solid var(--border-subtle); border-radius: 4px;">
            <p style="font-family: var(--font-display); color: var(--ink-secondary); font-size: 1.1rem; margin-bottom: 1rem;">
              Poem ${num} is not yet available in this collection.
            </p>
            <p style="color: var(--ink-muted); font-size: 0.95rem;">
              The Puranaanooru is being populated progressively in traditional order. Please check back later.
            </p>
            <a href="index.html" style="display: inline-block; margin-top: 1.5rem; color: var(--accent-vermillion); text-decoration: none; font-family: var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85rem;">← Back to all poems</a>
          </div>
        `;
        document.getElementById('bc-poem').textContent = `Poem ${num}`;
        document.getElementById('page-title').textContent = `Poem ${num} · Not Yet Available · புறநானூறு`;
        return;
      }

      // Page title & breadcrumb
      document.getElementById('page-title').textContent = `Poem ${poem.num} · ${poem.poetEnglish} · புறநானூறு`;
      document.getElementById('bc-poem').textContent = `Poem ${poem.num}`;

      // Build the page
      container.innerHTML = `
        <div class="poem-metadata">
          <div class="meta-item">
            <div class="meta-label">Poet · புலவர்</div>
            <div class="meta-value-tamil">${poem.poet}</div>
            <div class="meta-value-english">${poem.poetEnglish}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Patron · பாட்டுடைத் தலைவன்</div>
            <div class="meta-value-tamil">${poem.patron}</div>
            <div class="meta-value-english">${poem.patronEnglish}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Situation · துறை</div>
            <div class="meta-value-tamil">${poem.turai}</div>
            <div class="meta-value-english">${poem.turaiEnglish}</div>
          </div>
          <div class="meta-item">
            <div class="meta-label">Mode · திணை</div>
            <div class="meta-value-tamil">${poem.thinai}</div>
            <div class="meta-value-english">${poem.thinaiEnglish}</div>
          </div>
        </div>

        <div class="poem-card">
          <div class="poem-number-badge">Puṟanāṉūṟu <span class="num">${poem.num}</span> of 400</div>

          <div class="poem-layer">
            <div class="poem-layer-label">Tamil · தமிழ்</div>
            <div class="poem-tamil-text">${escapeHtml(poem.tamil)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Transliteration</div>
            <div class="poem-translit-text">${escapeHtml(poem.transliteration)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">English Translation</div>
            <div class="poem-english-text">${escapeHtml(poem.english)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Tamil Commentary · உரை</div>
            <div class="poem-urai-text">${escapeHtml(poem.tamilUrai)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Alternative Rendering</div>
            <div class="poem-alt-text">${escapeHtml(poem.altTranslation)}</div>
          </div>

          <div class="poem-layer">
            <div class="poem-layer-label">Historical Note</div>
            <div class="poem-note">${escapeHtml(poem.note)}</div>
          </div>
        </div>
      `;

      // Prev/Next — find the previous and next populated poems
      function findPrev(n) {
        for (let i = n - 1; i >= 1; i--) if (poemsByNum.has(i)) return poemsByNum.get(i);
        return null;
      }
      function findNext(n) {
        for (let i = n + 1; i <= 400; i++) if (poemsByNum.has(i)) return poemsByNum.get(i);
        return null;
      }
      const prev = findPrev(poem.num);
      const next = findNext(poem.num);

      document.getElementById('poem-nav').innerHTML = `
        <a href="${prev ? `poem.html?n=${prev.num}` : '#'}"
           class="poem-nav-link ${prev ? '' : 'disabled'}">
          <div class="poem-nav-direction">← Previous</div>
          <div class="poem-nav-poet">${prev ? prev.poetEnglish : '—'}</div>
          <div class="poem-nav-num">${prev ? `Poem ${prev.num}` : ''}</div>
        </a>
        <a href="${next ? `poem.html?n=${next.num}` : '#'}"
           class="poem-nav-link next ${next ? '' : 'disabled'}">
          <div class="poem-nav-direction">Next →</div>
          <div class="poem-nav-poet">${next ? next.poetEnglish : '—'}</div>
          <div class="poem-nav-num">${next ? `Poem ${next.num}` : ''}</div>
        </a>
      `;
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
  </script>

</body>
</html>
