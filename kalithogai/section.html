<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">திணை · கலித்தொகை</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/kalithogai.css"/>
  <style>
    .sec-page{max-width:1020px;margin:0 auto;padding:2rem 1.5rem 4rem}
    .sec-bc{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--ink-muted);margin-bottom:2rem;flex-wrap:wrap}
    .sec-bc a{color:var(--ink-secondary);text-decoration:none}
    .sec-bc a:hover{color:var(--kl-teal,#0d5c6e)}
    .sec-bc .sep{opacity:.45}
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="20" r="14" stroke-width="1" opacity="0.35"/>
            <path d="M 20 6 Q 28 10 28 20 Q 28 30 20 34 Q 18 26 18 20 Q 18 12 20 6 Z" fill="currentColor" opacity="0.25" stroke="none"/>
            <path d="M 20 6 Q 24 13 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 20 34 Q 16 27 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 6 20 Q 13 16 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 34 20 Q 27 24 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 9 9 Q 14 15 20 20" stroke-width="1" opacity="0.6"/>
            <path d="M 31 9 Q 26 15 20 20" stroke-width="1" opacity="0.6"/>
            <path d="M 9 31 Q 14 25 20 20" stroke-width="1" opacity="0.6"/>
            <path d="M 31 31 Q 26 25 20 20" stroke-width="1" opacity="0.6"/>
            <circle cx="20" cy="20" r="3" fill="currentColor" opacity="0.9" stroke="none"/>
            <circle cx="20" cy="20" r="1.2" fill="var(--bg-primary,white)" stroke="none"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">கலித்தொகை</span>
          <span class="wordmark-english">Kalittokai</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="sec-page">
      <nav class="sec-bc">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Kalittokai</a>
        <span class="sep">›</span>
        <span id="bc-sec">…</span>
      </nav>

      <div id="sec-banner"></div>
      <div id="poem-grid" class="kl-poem-grid"></div>
      <nav class="kl-sec-nav" id="sec-nav"></nav>
    </div>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(13,92,110,.2);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--kl-teal,#0d5c6e);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>கலித்தொகை · <a href="../index.html" style="color:var(--kl-teal,#0d5c6e)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/poems.js"></script>
  <script>
  (function(){
    const data = window.KL_DATA;
    const params = new URLSearchParams(window.location.search);
    const tinai = params.get('t') || 'palai';

    function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const sec = data.sections.find(s=>s.tinai===tinai);
    if(!sec){ document.getElementById('sec-banner').innerHTML='<p style="text-align:center;padding:3rem">Section not found.</p>'; return; }

    document.title = `${sec.name} · கலித்தொகை`;
    document.getElementById('page-title').textContent = `${sec.name} · கலித்தொகை`;
    document.getElementById('bc-sec').textContent = `${sec.name} · ${sec.nameEnglish}`;

    document.getElementById('sec-banner').innerHTML = `
      <div class="kl-section-banner" data-tinai="${esc(tinai)}">
        <div class="kl-banner-num">${esc(sec.poems)} · By ${esc(sec.poetEnglish)}</div>
        <div class="kl-banner-tamil">${esc(sec.name)}</div>
        <div class="kl-banner-eng">${esc(sec.nameEnglish)}</div>
        <div class="kl-banner-desc">${esc(sec.desc)}</div>
      </div>`;

    const poems = data.poems.filter(p=>p.tinai===tinai);
    const grid = document.getElementById('poem-grid');
    poems.forEach(p=>{
      const incipit = p.tamil.split('\n')[0];
      const card = document.createElement('a');
      card.href = `poem.html?n=${p.num}`;
      card.className = 'kl-poem-card';
      card.dataset.tinai = tinai;
      card.innerHTML = `
        <div class="kl-card-num">Poem ${p.num} · ${esc(p.poet)}</div>
        <div class="kl-card-speaker">${esc(p.speakerEnglish)}</div>
        <div class="kl-card-incipit">${esc(incipit)}…</div>
        <div class="kl-card-theme">${esc(p.turaiEnglish)}</div>
        <div class="kl-card-footer">
          <span class="kl-tinai-badge" data-tinai="${esc(tinai)}">${esc(p.sectionName)}</span>
          <span>→</span>
        </div>`;
      grid.appendChild(card);
    });

    // Prev/next section
    const secOrder = ['palai','kurinji','mullai','marutam','neytal'];
    const idx = secOrder.indexOf(tinai);
    const prev = idx>0 ? data.sections.find(s=>s.tinai===secOrder[idx-1]) : null;
    const next = idx<secOrder.length-1 ? data.sections.find(s=>s.tinai===secOrder[idx+1]) : null;
    document.getElementById('sec-nav').innerHTML = `
      <a href="${prev?`section.html?t=${prev.tinai}`:'#'}" class="kl-nav-link ${prev?'':'disabled'}">
        <div class="kl-nav-dir">← முந்தைய · Previous Book</div>
        <div class="kl-nav-title">${prev?esc(prev.name):'—'}</div>
        <div class="kl-nav-sub">${prev?esc(prev.nameEnglish):''}</div>
      </a>
      <a href="${next?`section.html?t=${next.tinai}`:'#'}" class="kl-nav-link next ${next?'':'disabled'}">
        <div class="kl-nav-dir">அடுத்தது · Next Book →</div>
        <div class="kl-nav-title">${next?esc(next.name):'—'}</div>
        <div class="kl-nav-sub">${next?esc(next.nameEnglish):''}</div>
      </a>`;
  })();
  </script>
</body>
</html>
