<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பாடல் · கலித்தொகை</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/kalithogai.css"/>
  <style>
    .poem-page{max-width:860px;margin:0 auto;padding:2rem 1.5rem 4rem}
    .poem-bc{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--ink-muted);margin-bottom:2rem;flex-wrap:wrap}
    .poem-bc a{color:var(--ink-secondary);text-decoration:none}
    .poem-bc a:hover{color:var(--kl-teal,#0d5c6e)}
    .poem-bc .sep{opacity:.45}
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="20" r="14" stroke-width="1" opacity="0.35"/>
            <path d="M 20 6 Q 28 10 28 20 Q 28 30 20 34 Q 18 26 18 20 Q 18 12 20 6 Z" fill="currentColor" opacity="0.25" stroke="none"/>
            <path d="M 20 6 Q 24 13 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 20 34 Q 16 27 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 6 20 Q 13 16 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 34 20 Q 27 24 20 20" stroke-width="1.2" opacity="0.8"/>
            <path d="M 9 9 Q 14 15 20 20" stroke-width="1" opacity="0.6"/>
            <path d="M 31 9 Q 26 15 20 20" stroke-width="1" opacity="0.6"/>
            <path d="M 9 31 Q 14 25 20 20" stroke-width="1" opacity="0.6"/>
            <path d="M 31 31 Q 26 25 20 20" stroke-width="1" opacity="0.6"/>
            <circle cx="20" cy="20" r="3" fill="currentColor" opacity="0.9" stroke="none"/>
            <circle cx="20" cy="20" r="1.2" fill="var(--bg-primary,white)" stroke="none"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">கலித்தொகை</span>
          <span class="wordmark-english">Kalittokai</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="poem-page">
      <nav class="poem-bc">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Kalittokai</a>
        <span class="sep">›</span>
        <a href="#" id="bc-sec-link" style="color:var(--ink-secondary);text-decoration:none">…</a>
        <span class="sep">›</span>
        <span id="bc-poem">…</span>
      </nav>

      <div id="poem-container"></div>
      <nav class="kl-poem-nav" id="poem-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(13,92,110,.2);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:3rem">
    <div style="color:var(--kl-teal,#0d5c6e);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>கலித்தொகை · <a href="../index.html" style="color:var(--kl-teal,#0d5c6e)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/poems.js"></script>
  <script>
  (function(){
    const data = window.KL_DATA;
    const params = new URLSearchParams(window.location.search);
    const num = parseInt(params.get('n'),10) || 1;

    function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const byNum = new Map(data.poems.map(p=>[p.num,p]));
    const poem = byNum.get(num);
    const container = document.getElementById('poem-container');

    if(!poem){
      container.innerHTML=`<div style="text-align:center;padding:3rem;background:var(--bg-paper);border:1px solid var(--border-subtle);border-radius:4px;">
        <p style="font-family:var(--font-display);color:var(--ink-secondary)">Poem ${num} not found.</p>
        <a href="index.html" style="display:inline-block;margin-top:1.5rem;color:var(--kl-teal,#0d5c6e);font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase;font-size:.85rem">← Back to Kalittokai</a>
      </div>`;
      document.getElementById('bc-poem').textContent=`Poem ${num}`;
      return;
    }

    document.title = `Poem ${poem.num} · ${poem.sectionName} · கலித்தொகை`;
    document.getElementById('page-title').textContent = `Poem ${poem.num} · கலித்தொகை`;
    document.getElementById('bc-poem').textContent = `Poem ${poem.num}`;

    // Section breadcrumb
    const secLink = document.getElementById('bc-sec-link');
    if(secLink){
      const sec = data.sections.find(s=>s.tinai===poem.tinai);
      if(sec){ secLink.textContent=sec.name+' · '+sec.nameEnglish; secLink.href='section.html?t='+poem.tinai; }
    }

    container.innerHTML = `
      <div class="kl-poem-banner" data-tinai="${esc(poem.tinai)}">
        <div class="kl-banner-poem-num">${poem.num}</div>
        <div>
          <div class="kl-banner-poem-speaker">${esc(poem.speakerEnglish)}</div>
          <div class="kl-banner-poem-turai">${esc(poem.turai)}</div>
          <div class="kl-banner-poem-meta">${esc(poem.poet)} · ${esc(poem.sectionName)} · ${esc(poem.sectionNameEnglish)}</div>
        </div>
      </div>

      <div class="kl-verse-card">

        <div class="kl-verse-layer">
          <div class="kl-layer-label">Tamil · தமிழ்</div>
          <div class="kl-tamil-text">${esc(poem.tamil)}</div>
        </div>

        <div class="kl-verse-layer">
          <div class="kl-layer-label">Transliteration</div>
          <div class="kl-translit-text">${esc(poem.transliteration)}</div>
        </div>

        <div class="kl-verse-layer">
          <div class="kl-layer-label">English Translation</div>
          <div class="kl-english-text">${esc(poem.english)}</div>
        </div>

        <div class="kl-verse-layer">
          <div class="kl-layer-label">Tamil Commentary · உரை</div>
          <div class="kl-urai-text">${esc(poem.tamilUrai)}</div>
        </div>

        <div class="kl-verse-layer">
          <div class="kl-layer-label">Alternative Rendering</div>
          <div class="kl-alt-text">${esc(poem.altTranslation)}</div>
        </div>

        <div class="kl-verse-layer">
          <div class="kl-layer-label">Literary Note</div>
          <div class="kl-note">${esc(poem.note)}</div>
        </div>

      </div>`;

    // Prev / Next within same tiṇai section
    const sectionPoems = data.poems.filter(p=>p.tinai===poem.tinai).sort((a,b)=>a.num-b.num);
    const idx = sectionPoems.findIndex(p=>p.num===num);
    const prev = idx>0 ? sectionPoems[idx-1] : null;
    const next = idx<sectionPoems.length-1 ? sectionPoems[idx+1] : null;

    document.getElementById('poem-nav').innerHTML = `
      <a href="${prev?`poem.html?n=${prev.num}`:'#'}" class="kl-pnav-link ${prev?'':'disabled'}">
        <div class="kl-pnav-dir">← முந்தைய · Previous</div>
        <div class="kl-pnav-turai">${prev?esc(prev.turai):'—'}</div>
        <div class="kl-pnav-sub">${prev?'Poem '+prev.num+' · '+esc(prev.speakerEnglish):''}</div>
      </a>
      <a href="${next?`poem.html?n=${next.num}`:'#'}" class="kl-pnav-link next ${next?'':'disabled'}">
        <div class="kl-pnav-dir">அடுத்தது · Next →</div>
        <div class="kl-pnav-turai">${next?esc(next.turai):'—'}</div>
        <div class="kl-pnav-sub">${next?'Poem '+next.num+' · '+esc(next.speakerEnglish):''}</div>
      </a>`;
  })();
  </script>
</body>
</html>
