<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Verse · மூதுரை</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .verse-page {
      max-width: 780px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .verse-breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--ink-muted);
      margin-bottom: 2rem;
      letter-spacing: 0.05em;
    }
    .verse-breadcrumb a {
      color: var(--ink-secondary);
      text-decoration: none;
    }
    .verse-breadcrumb a:hover {
      color: var(--accent-vermillion);
    }
    .verse-breadcrumb .sep {
      opacity: 0.5;
    }

    /* The verse card — palm-leaf page */
    .verse-card {
      position: relative;
      background: var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(43, 22, 7, 0) 0%, rgba(43, 22, 7, 0.04) 50%, rgba(43, 22, 7, 0) 100%),
        repeating-linear-gradient(0deg,
          rgba(43, 22, 7, 0.025) 0px, rgba(43, 22, 7, 0.025) 1px,
          transparent 1px, transparent 8px);
      border: 1px solid var(--border-medium);
      border-radius: 4px;
      padding: 3.5rem 3rem;
      box-shadow: var(--shadow-paper);
      overflow: hidden;
    }

    .verse-card::before,
    .verse-card::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--bg-primary);
      border: 1.5px solid var(--border-strong);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .verse-card::before { left: 14px; }
    .verse-card::after  { right: 14px; }

    .verse-number-badge {
      text-align: center;
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 2.5rem;
    }

    /* Layer styles */
    .verse-layer {
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .verse-layer:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .verse-layer-label {
      font-family: var(--font-display);
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent-ochre);
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .verse-tamil-text {
      font-family: var(--font-tamil);
      font-size: 1.875rem;
      line-height: 1.6;
      color: var(--ink-primary);
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: pre-line;
    }

    .verse-translit-text {
      font-family: var(--font-body);
      font-style: italic;
      font-size: 1.25rem;
      line-height: 1.65;
      color: var(--ink-secondary);
      letter-spacing: 0.02em;
      white-space: pre-line;
    }

    .verse-english-text {
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--ink-primary);
    }

    .verse-urai-text {
      font-family: var(--font-tamil);
      font-size: 1.0625rem;
      line-height: 1.85;
      color: var(--ink-secondary);
    }

    .verse-alt-text {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.125rem;
      line-height: 1.7;
      color: var(--ink-secondary);
    }

    /* Audio button */
    .verse-audio {
      margin: 1rem 0 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(139, 26, 14, 0.08);
      border: 1px solid var(--accent-vermillion);
      border-radius: 20px;
      color: var(--accent-vermillion);
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
    }
    .audio-btn:hover {
      background: var(--accent-vermillion);
      color: var(--bg-paper);
    }

    /* Prev / Next navigation */
    .verse-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .verse-nav-link {
      display: block;
      padding: 1.25rem 1.5rem;
      background: var(--bg-paper);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
    }
    .verse-nav-link:hover {
      border-color: var(--accent-vermillion);
      transform: translateY(-2px);
      box-shadow: var(--shadow-paper);
    }
    .verse-nav-link.next {
      text-align: right;
    }
    .verse-nav-link.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .verse-nav-direction {
      font-family: var(--font-display);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.35rem;
    }
    .verse-nav-tamil {
      font-family: var(--font-tamil);
      font-size: 1rem;
      color: var(--ink-primary);
      line-height: 1.4;
    }

    @media (max-width: 640px) {
      .verse-card { padding: 2.5rem 1.5rem; }
      .verse-tamil-text { font-size: 1.5rem; }
      .verse-nav { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="20" cy="30" rx="10" ry="3" fill="currentColor" opacity="0.25" stroke="none"/>
            <path d="M 14 30 L 12 20 Q 20 13 28 20 L 26 30 Z" fill="currentColor" opacity="0.4" stroke="none"/>
            <path d="M 20 13 Q 18.5 8 20 5 Q 21.5 8 20 13 Z" fill="currentColor" opacity="0.9" stroke="none"/>
            <ellipse cx="20" cy="14.5" rx="3" ry="2" fill="currentColor" opacity="0.75" stroke="none"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">மூதுரை</span>
          <span class="wordmark-english">Moodhurai</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Verses</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="verse-page">

      <nav class="verse-breadcrumb">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Moodhurai</a>
        <span class="sep">›</span>
        <span id="bc-verse">…</span>
      </nav>

      <div class="verse-card" id="verse-card">
        <!-- populated by JS -->
      </div>

      <nav class="verse-nav" id="verse-nav">
        <!-- populated by JS -->
      </nav>

    </article>
  </main>

  <script src="data/verses.js"></script>
  <script>
    (function() {
      const data = window.MOODHURAI_DATA;
      const params = new URLSearchParams(window.location.search);
      const num = parseInt(params.get('n'), 10) || 1;

      const verse = data.verses.find(v => v.num === num);
      if (!verse) {
        document.getElementById('verse-card').innerHTML =
          '<p style="text-align: center; padding: 2rem;">Verse not found. ' +
          '<a href="index.html" style="color: var(--accent-vermillion);">Return to all verses →</a></p>';
        return;
      }

      // Page title
      document.getElementById('page-title').textContent =
        'Verse ' + verse.num + ' · ' + verse.tamil.split('\n')[0] + ' · மூதுரை';

      // Breadcrumb
      document.getElementById('bc-verse').textContent = 'Verse ' + verse.num;

      // Escape for onclick attribute
      const tamilEscaped = verse.tamil.replace(/'/g, "\\'").replace(/\n/g, ' ');

      // Verse card
      document.getElementById('verse-card').innerHTML =
        '<div class="verse-number-badge">மூதுரை · Verse ' + verse.num + ' of 30</div>' +

        '<div class="verse-layer">' +
          '<div class="verse-layer-label">Tamil · தமிழ்</div>' +
          '<div class="verse-tamil-text">' + verse.tamil + '</div>' +
          '<div class="verse-audio">' +
            '<button class="audio-btn" onclick="speakTamil(\'' + tamilEscaped + '\')">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
                '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>' +
                '<path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>' +
              '</svg>' +
              'Listen' +
            '</button>' +
          '</div>' +
        '</div>' +

        '<div class="verse-layer">' +
          '<div class="verse-layer-label">Transliteration</div>' +
          '<div class="verse-translit-text">' + verse.transliteration + '</div>' +
        '</div>' +

        '<div class="verse-layer">' +
          '<div class="verse-layer-label">English Meaning</div>' +
          '<div class="verse-english-text">' + verse.english + '</div>' +
        '</div>' +

        '<div class="verse-layer">' +
          '<div class="verse-layer-label">Tamil Commentary · உரை</div>' +
          '<div class="verse-urai-text">' + verse.tamilUrai + '</div>' +
        '</div>' +

        '<div class="verse-layer">' +
          '<div class="verse-layer-label">Alternative English Rendering</div>' +
          '<div class="verse-alt-text">' + verse.altTranslation + '</div>' +
        '</div>';

      // Prev / Next nav
      const prev = data.verses.find(v => v.num === verse.num - 1);
      const next = data.verses.find(v => v.num === verse.num + 1);

      document.getElementById('verse-nav').innerHTML =
        '<a href="' + (prev ? 'verse.html?n=' + prev.num : '#') + '" ' +
           'class="verse-nav-link' + (prev ? '' : ' disabled') + '">' +
          '<div class="verse-nav-direction">← Previous</div>' +
          '<div class="verse-nav-tamil">' + (prev ? prev.tamil.split('\n')[0] : 'First verse') + '</div>' +
        '</a>' +
        '<a href="' + (next ? 'verse.html?n=' + next.num : '#') + '" ' +
           'class="verse-nav-link next' + (next ? '' : ' disabled') + '">' +
          '<div class="verse-nav-direction">Next →</div>' +
          '<div class="verse-nav-tamil">' + (next ? next.tamil.split('\n')[0] : 'Last verse') + '</div>' +
        '</a>';
    })();

    // Tamil text-to-speech
    function speakTamil(text) {
      if (!('speechSynthesis' in window)) {
        alert('Speech not supported in this browser.');
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const tamilVoice = voices.find(v => v.lang.startsWith('ta'))
                      || voices.find(v => v.lang.startsWith('hi'))
                      || voices.find(v => v.lang.startsWith('en-IN'));
      if (tamilVoice) utter.voice = tamilVoice;
      utter.lang = tamilVoice ? tamilVoice.lang : 'ta-IN';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
    }
  </script>

</body>
</html>
