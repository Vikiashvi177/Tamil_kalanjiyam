<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பகுதி · பரிபாடல்</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/paripaadal.css"/>
  <style>
    .sec-page{max-width:1020px;margin:0 auto;padding:2rem 1.5rem 4rem}
    .sec-bc{display:flex;align-items:center;gap:.5rem;font-size:.875rem;color:var(--ink-muted);margin-bottom:2rem;flex-wrap:wrap}
    .sec-bc a{color:var(--ink-secondary);text-decoration:none}
    .sec-bc a:hover{color:var(--pp-violet,#3a1a5a)}
    .sec-bc .sep{opacity:.45}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 20 8 Q 30 8 32 16 Q 34 24 28 28 Q 22 32 16 28 Q 10 24 12 16 Q 14 10 20 8 Z" stroke-width="1.3" opacity="0.85"/>
            <path d="M 20 12 Q 27 12 28 18 Q 29 22 25 25 Q 21 27 17 25 Q 13 22 14 17 Q 15 13 20 12 Z" stroke-width="0.8" opacity="0.5"/>
            <path d="M 14 28 Q 10 32 8 36" stroke-width="1.8" opacity="0.8"/>
            <path d="M 32 16 Q 35 12 34 10 Q 33 9 31 10" stroke-width="1" opacity="0.55"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">பரிபாடல்</span>
          <span class="wordmark-english">Paripaāṭal</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="sec-page">
      <nav class="sec-bc">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Paripaāṭal</a>
        <span class="sep">›</span>
        <span id="bc-sec">…</span>
      </nav>
      <div id="sec-banner"></div>
      <div id="poem-grid" class="pp-poem-grid"></div>
      <nav class="pp-sec-nav" id="sec-nav"></nav>
    </div>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(58,26,90,.2);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--pp-violet,#3a1a5a);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>பரிபாடல் · <a href="../index.html" style="color:var(--pp-violet,#3a1a5a)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/poems.js"></script>
  <script>
  (function(){
    const data = window.PP_DATA;
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('s') || 'tirumal';
    function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    const sec = data.sections.find(s=>s.slug===slug);
    if(!sec){ document.getElementById('sec-banner').innerHTML='<p style="text-align:center;padding:3rem">Section not found.</p>'; return; }

    document.title = `${sec.tamil} · பரிபாடல்`;
    document.getElementById('page-title').textContent = `${sec.tamil} · பரிபாடல்`;
    document.getElementById('bc-sec').textContent = `${sec.tamil} · ${sec.nameEnglish}`;

    document.getElementById('sec-banner').innerHTML = `
      <div class="pp-section-banner" data-sec="${esc(slug)}">
        <div class="pp-banner-num">${esc(sec.poems)} · ${sec.count} surviving poems</div>
        <div class="pp-banner-deity">${esc(sec.tamil)}</div>
        <div class="pp-banner-eng">${esc(sec.nameEnglish)}</div>
        <div class="pp-banner-desc">${esc(sec.desc)}</div>
      </div>
      <div class="pp-music-note">♪ Each Paripaāṭal poem was composed with music notation — the melodies are lost, but the words endure.</div>`;

    const poems = data.poems.filter(p=>p.section===slug);
    const grid = document.getElementById('poem-grid');
    poems.forEach(p=>{
      const incipit = p.tamil.split('\n')[0];
      const card = document.createElement('a');
      card.href = `poem.html?n=${p.num}`;
      card.className = 'pp-poem-card';
      card.dataset.sec = slug;
      card.innerHTML = `
        <div class="pp-card-num">Poem ${p.num} of 22</div>
        <div class="pp-card-poet">${esc(p.poet)} · ${esc(p.poetEnglish)}</div>
        <div class="pp-card-incipit">${esc(incipit)}…</div>
        <div class="pp-card-theme">${esc(p.themeEnglish)}</div>
        <div class="pp-card-footer">
          <span class="pp-deity-badge" data-sec="${esc(slug)}">${esc(p.deity)}</span>
          <span>→</span>
        </div>`;
      grid.appendChild(card);
    });

    const secOrder = ['tirumal','murugan','vaiyai'];
    const idx = secOrder.indexOf(slug);
    const prev = idx>0 ? data.sections.find(s=>s.slug===secOrder[idx-1]) : null;
    const next = idx<secOrder.length-1 ? data.sections.find(s=>s.slug===secOrder[idx+1]) : null;
    document.getElementById('sec-nav').innerHTML = `
      <a href="${prev?`section.html?s=${prev.slug}`:'#'}" class="pp-nav-link ${prev?'':'disabled'}">
        <div class="pp-nav-dir">← முந்தைய · Previous</div>
        <div class="pp-nav-deity">${prev?esc(prev.tamil):'—'}</div>
        <div class="pp-nav-sub">${prev?esc(prev.nameEnglish):''}</div>
      </a>
      <a href="${next?`section.html?s=${next.slug}`:'#'}" class="pp-nav-link next ${next?'':'disabled'}">
        <div class="pp-nav-dir">அடுத்தது · Next →</div>
        <div class="pp-nav-deity">${next?esc(next.tamil):'—'}</div>
        <div class="pp-nav-sub">${next?esc(next.nameEnglish):''}</div>
      </a>`;
  })();
  </script>
</body>
</html>
