<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பாசுரம் · கண்ணினுண் சிறுத்தாம்பு</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/kanninun.css"/>
  <style>
    :root {
      --ks-green:       #1f4a2a;
      --ks-green-mid:   #2d6b3a;
      --ks-green-pale:  rgba(31,74,42,.08);
      --ks-green-pale2: rgba(31,74,42,.14);
      --ks-forest:      #163520;
      --tp-flame:       #1f4a2a;
      --tp-flame-mid:   #2d6b3a;
      --tp-flame-pale:  rgba(31,74,42,.08);
      --tp-flame-pale2: rgba(31,74,42,.14);
      --tp-gold:        #1f4a2a;
    }

    .ks-pasuram-page { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .ks-bc {
      display:flex; align-items:center; gap:.5rem;
      font-size:.875rem; color:var(--ink-muted);
      margin-bottom:2rem; letter-spacing:.04em; flex-wrap:wrap;
    }
    .ks-bc a { color:var(--ink-secondary); text-decoration:none; }
    .ks-bc a:hover { color:var(--ks-green); }
    .ks-bc .sep { opacity:.45; }

    .ks-address-badge {
      display:inline-flex; align-items:center; gap:.5rem;
      background:rgba(31,74,42,.07);
      border:1px solid rgba(31,74,42,.22);
      border-radius:20px;
      padding:.3rem .85rem;
      font-family:var(--font-display);
      font-size:.75rem;
      color:var(--ks-green);
      letter-spacing:.1em;
      margin-bottom:1rem;
    }

    /* Addressed-to note */
    .ks-addressed-note {
      background: rgba(31,74,42,.05);
      border-left: 3px solid var(--ks-green);
      padding: .7rem 1rem;
      border-radius: 0 4px 4px 0;
      font-family: var(--font-display);
      font-size: .85rem;
      color: var(--ks-green);
      margin-bottom: 1.5rem;
      opacity: .85;
    }

    .ks-pasuram-card {
      position:relative;
      background:var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(31,74,42,0) 0%, rgba(31,74,42,.025) 50%, rgba(31,74,42,0) 100%),
        repeating-linear-gradient(0deg,
          rgba(31,74,42,.02) 0px, rgba(31,74,42,.02) 1px,
          transparent 1px, transparent 8px);
      border:1px solid var(--border-medium);
      border-radius:4px;
      padding:3.5rem 3rem;
      box-shadow:var(--shadow-paper);
      overflow:hidden;
    }
    .ks-pasuram-card::before,
    .ks-pasuram-card::after {
      content:''; position:absolute; top:50%; transform:translateY(-50%);
      width:14px; height:14px; border-radius:50%;
      background:var(--bg-primary); border:1.5px solid var(--border-strong);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
    }
    .ks-pasuram-card::before { left:14px; }
    .ks-pasuram-card::after  { right:14px; }

    .ks-pasuram-num {
      text-align:center; font-family:var(--font-display);
      font-size:.78rem; letter-spacing:.28em; text-transform:uppercase;
      color:var(--ks-green); margin-bottom:.3rem;
    }
    .ks-incipit {
      text-align:center; font-family:var(--font-display);
      font-style:italic; font-size:1rem; color:var(--ks-green);
      margin-bottom:2rem; letter-spacing:.03em;
    }

    .ks-panel-label {
      font-family:var(--font-display); font-size:.72rem;
      letter-spacing:.25em; text-transform:uppercase;
      color:var(--ks-green); margin-bottom:.65rem; font-weight:500;
    }
    .ks-tamil-panel {
      margin-bottom:1.75rem; padding-bottom:1.75rem;
      border-bottom:1px solid var(--border-subtle);
    }
    .ks-tamil-text {
      font-family:var(--font-tamil); font-size:1.875rem;
      line-height:1.65; color:var(--ink-primary); font-weight:600;
      white-space:pre-line; margin:0;
    }
    .ks-listen-btn {
      display:inline-flex; align-items:center; gap:.45rem;
      margin-top:.85rem; padding:.45rem .9rem;
      background:rgba(31,74,42,.07); border:1px solid var(--ks-green);
      border-radius:20px; color:var(--ks-green);
      font-family:var(--font-display); font-size:.8rem;
      letter-spacing:.1em; text-transform:uppercase;
      cursor:pointer; transition:all .15s;
    }
    .ks-listen-btn:hover { background:var(--ks-green); color:var(--bg-paper); }

    .ks-collapsible {
      background:var(--bg-paper); border:1px solid rgba(31,74,42,.2);
      border-radius:4px; margin-bottom:.75rem; overflow:hidden;
    }
    .ks-toggle {
      width:100%; text-align:left; background:none; border:none;
      cursor:pointer; padding:1rem 1.5rem;
      font-family:var(--font-display); font-size:.9rem;
      color:var(--ink-secondary); display:flex; align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(31,74,42,.12); transition:background .12s;
    }
    .ks-toggle:hover { background:rgba(31,74,42,.07); }
    .ks-toggle .arrow { font-size:.75rem; transition:transform .2s; color:var(--ks-green); }
    .ks-toggle.open .arrow { transform:rotate(180deg); }
    .ks-panel-body { padding:1.2rem 1.5rem 1.4rem; display:none; }
    .ks-panel-body.open { display:block; }

    .ks-translit { font-family:var(--font-body); font-style:italic; font-size:1.15rem; line-height:1.65; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .ks-english  { font-family:var(--font-display); font-size:1.25rem; font-style:italic; line-height:1.65; color:var(--ink-primary); white-space:pre-line; margin:0; }
    .ks-urai     { font-family:var(--font-tamil); font-size:1.0625rem; line-height:1.85; color:var(--ink-secondary); }
    .ks-alt      { font-family:var(--font-display); font-style:italic; font-size:1.1rem; line-height:1.7; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .ks-theme    { font-family:var(--font-body); font-size:.975rem; line-height:1.75; color:var(--ink-secondary); }
    .ks-note     { font-family:var(--font-body); font-size:.975rem; line-height:1.8; color:var(--ink-secondary); }

    /* 11-dot progress -->
    .ks-progress {
      display:flex; justify-content:center; gap:.4rem;
      margin-bottom:1.5rem; flex-wrap:wrap;
    }
    .ks-progress-dot {
      width:9px; height:9px; border-radius:50%;
      background:rgba(31,74,42,.18); transition:background .2s;
    }
    .ks-progress-dot.active  { background:var(--ks-green); }
    .ks-progress-dot.visited { background:rgba(31,74,42,.45); }

    .ks-nav {
      display:grid; grid-template-columns:1fr 1fr;
      gap:1rem; margin-top:2.5rem;
    }
    .ks-nav-link {
      display:block; padding:1.2rem 1.4rem;
      background:var(--bg-paper); border:1px solid var(--border-subtle);
      border-radius:4px; text-decoration:none; color:inherit;
      transition:all .2s ease;
    }
    .ks-nav-link:hover { border-color:var(--ks-green); transform:translateY(-2px); box-shadow:var(--shadow-paper); }
    .ks-nav-link.next { text-align:right; }
    .ks-nav-link.disabled { opacity:.35; pointer-events:none; }
    .ks-nav-dir     { font-family:var(--font-display); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.35rem; }
    .ks-nav-sub     { font-family:var(--font-display); font-size:.72rem; color:var(--ks-green); opacity:.75; margin-bottom:.15rem; }
    .ks-nav-incipit { font-family:var(--font-display); font-style:italic; font-size:.85rem; color:var(--ks-green); margin-bottom:.2rem; }
    .ks-nav-tamil   { font-family:var(--font-tamil); font-size:.95rem; color:var(--ink-primary); line-height:1.4; }

    @media (max-width:640px) {
      .ks-pasuram-card { padding:2.5rem 1.5rem; }
      .ks-tamil-text   { font-size:1.5rem; }
      .ks-nav          { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark" style="color:var(--ks-green,#1f4a2a)">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"
               fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="13" cy="14" r="4" fill="currentColor" opacity=".7" stroke="none"/>
            <circle cx="27" cy="14" r="4" fill="currentColor" opacity=".45" stroke="none"/>
            <path d="M 17 14 Q 20 20 23 14" stroke-width="1.6" opacity=".65"/>
            <line x1="13" y1="18" x2="13" y2="28" stroke-width="1.4" opacity=".6"/>
            <line x1="27" y1="18" x2="27" y2="28" stroke-width="1.4" opacity=".4"/>
            <line x1="10" y1="28" x2="16" y2="28" stroke-width="1.2" opacity=".55"/>
            <line x1="24" y1="28" x2="30" y2="28" stroke-width="1.2" opacity=".35"/>
            <line x1="17" y1="22" x2="23" y2="22" stroke-width="1.3" opacity=".5" stroke-dasharray="1.5 1.5"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil" style="color:var(--ks-green,#1f4a2a)">கண்ணினுண் சிறுத்தாம்பு</span>
          <span class="wordmark-english">Kaṇṇinuṇ Ciṟuttāmpu</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Pāsurams</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="ks-pasuram-page">
      <nav class="ks-bc" id="bc"></nav>
      <div class="ks-progress" id="progress"></div>
      <div id="address-badge"></div>
      <div class="ks-addressed-note" id="addressed-note"></div>
      <div class="ks-pasuram-card" id="pasuram-card"></div>
      <nav class="ks-nav" id="pasuram-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(31,74,42,.15);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--ks-green,#1f4a2a);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>கண்ணினுண் சிறுத்தாம்பு · <a href="../index.html" style="color:var(--ks-green,#1f4a2a)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/verses.js"></script>
  <script>
  (function(){
    const { verses } = window.KS_DATA;
    const params = new URLSearchParams(window.location.search);
    const num    = parseInt(params.get('n'), 10) || 1;
    const verse  = verses.find(v => v.num === num);
    const card   = document.getElementById('pasuram-card');
    const nav    = document.getElementById('pasuram-nav');
    const bc     = document.getElementById('bc');

    const addressedTo = [
      'To Nammāḻvār', 'Confession & Rescue', 'Karma Dissolved', 'Soul Found',
      'Tamil Veda', 'Words as Nectar', 'One Letter Suffices',
      'Eight Letters', 'All Āḻvārs', 'I Shall Remain', 'Phalaśruti'
    ];

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    if (!verse) {
      card.innerHTML = '<p style="text-align:center;padding:2rem">Pāsuram not found. <a href="index.html" style="color:var(--ks-green)">Return →</a></p>';
      return;
    }

    const idx = verses.findIndex(v => v.num === num);

    document.getElementById('page-title').textContent =
      'Pāsuram ' + verse.num + ' · ' + verse.incipit + ' · கண்ணினுண் சிறுத்தாம்பு';

    bc.innerHTML =
      '<a href="../index.html">Library</a><span class="sep"> › </span>' +
      '<a href="index.html">Kaṇṇinuṇ Ciṟuttāmpu</a><span class="sep"> › </span>' +
      '<span>Pāsuram ' + verse.num + '</span>';

    // Progress dots
    const prog = document.getElementById('progress');
    verses.forEach((v, i) => {
      const dot = document.createElement('div');
      dot.className = 'ks-progress-dot' + (i === idx ? ' active' : i < idx ? ' visited' : '');
      dot.title = addressedTo[i] || '';
      prog.appendChild(dot);
    });

    // Address badge
    document.getElementById('address-badge').innerHTML =
      '<div class="ks-address-badge">✦ ' + esc(addressedTo[idx] || '') + '</div>';

    // Addressed-to note
    document.getElementById('addressed-note').textContent =
      'Addressed to: Nammāḻvār of Tirukkurukūr — Madhurakavi's guru';

    card.innerHTML =
      '<div class="ks-pasuram-num">கண்ணினுண் சிறுத்தாம்பு · Pāsuram ' + verse.num + ' of 11</div>' +
      '<div class="ks-incipit">' + esc(verse.incipit) + '</div>' +

      '<div class="ks-tamil-panel">' +
        '<div class="ks-panel-label">Tamil · தமிழ்</div>' +
        '<pre class="ks-tamil-text">' + escPre(verse.tamil) + '</pre>' +
        '<button class="ks-listen-btn" onclick="speakTamil(' + JSON.stringify(verse.tamil) + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          'Listen · கேட்க' +
        '</button>' +
      '</div>' +

      collapsible('translit-' + num, 'Transliteration — ஒலிப்பெயர்ப்பு', false,
        '<pre class="ks-translit">' + escPre(verse.transliteration) + '</pre>') +
      collapsible('english-' + num, 'English Translation — ஆங்கில மொழிபெயர்ப்பு', true,
        '<pre class="ks-english">' + escPre(verse.english) + '</pre>') +
      collapsible('urai-' + num, 'தமிழ் உரை — Tamil Commentary', false,
        '<div class="ks-urai">' + esc(verse.tamilUrai) + '</div>') +
      collapsible('alt-' + num, 'Alternative Rendering', false,
        '<pre class="ks-alt">' + escPre(verse.altTranslation) + '</pre>') +
      collapsible('theme-' + num, 'Devotional Theme — பக்தி கருத்து', false,
        '<div class="ks-theme">' + esc(verse.theme) + '</div>') +
      collapsible('note-' + num, 'Literary & Theological Note', false,
        '<div class="ks-note">' + esc(verse.note) + '</div>');

    const prev = idx > 0 ? verses[idx - 1] : null;
    const next = idx < verses.length - 1 ? verses[idx + 1] : null;

    nav.innerHTML =
      '<a href="' + (prev ? 'pasuram.html?n=' + prev.num : '#') + '" class="ks-nav-link' + (prev ? '' : ' disabled') + '">' +
        '<div class="ks-nav-dir">← முந்தைய · Previous</div>' +
        (prev
          ? '<div class="ks-nav-sub">' + esc(addressedTo[idx-1]||'') + '</div>' +
            '<div class="ks-nav-incipit">' + esc(prev.incipit) + '</div>' +
            '<div class="ks-nav-tamil">' + esc(prev.tamil.split('\n')[0]) + '</div>'
          : '<div class="ks-nav-tamil">—</div>') +
      '</a>' +
      '<a href="' + (next ? 'pasuram.html?n=' + next.num : '#') + '" class="ks-nav-link next' + (next ? '' : ' disabled') + '">' +
        '<div class="ks-nav-dir">அடுத்தது · Next →</div>' +
        (next
          ? '<div class="ks-nav-sub">' + esc(addressedTo[idx+1]||'') + '</div>' +
            '<div class="ks-nav-incipit">' + esc(next.incipit) + '</div>' +
            '<div class="ks-nav-tamil">' + esc(next.tamil.split('\n')[0]) + '</div>'
          : '<div class="ks-nav-tamil">—</div>') +
      '</a>';

    document.querySelectorAll('.ks-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const open = target.classList.contains('open');
        target.classList.toggle('open', !open);
        btn.classList.toggle('open', !open);
      });
    });

    function collapsible(id, label, startOpen, bodyHtml) {
      return '<div class="ks-collapsible">' +
        '<button class="ks-toggle' + (startOpen ? ' open' : '') + '" data-target="' + id + '">' +
          '<span>' + label + '</span><span class="arrow">▾</span>' +
        '</button>' +
        '<div class="ks-panel-body' + (startOpen ? ' open' : '') + '" id="' + id + '">' +
          bodyHtml +
        '</div>' +
      '</div>';
    }
  })();

  function speakTamil(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('ta')) || voices.find(v => v.lang.startsWith('en-IN'));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'ta-IN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>

</body>
</html>
