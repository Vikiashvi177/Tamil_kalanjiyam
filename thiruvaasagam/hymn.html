<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">திருப்பாடல் · திருவாசகம்</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/thiruvaasagam.css"/>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo" aria-label="Thiruvaasagam home">
        <span class="mark">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="20" cy="20" r="3.5" fill="currentColor" opacity="0.9" stroke="none"/>
            <path d="M 20 7 Q 24 13 20 17 Q 16 13 20 7 Z" fill="currentColor" opacity="0.88"/>
            <path d="M 20 33 Q 24 27 20 23 Q 16 27 20 33 Z" fill="currentColor" opacity="0.88"/>
            <path d="M 7 20 Q 13 24 17 20 Q 13 16 7 20 Z" fill="currentColor" opacity="0.88"/>
            <path d="M 33 20 Q 27 24 23 20 Q 27 16 33 20 Z" fill="currentColor" opacity="0.88"/>
            <path d="M 11 11 Q 15 15 17 17 Q 13 15 11 11 Z" fill="currentColor" opacity="0.55"/>
            <path d="M 29 11 Q 25 15 23 17 Q 27 15 29 11 Z" fill="currentColor" opacity="0.55"/>
            <path d="M 11 29 Q 15 25 17 23 Q 13 25 11 29 Z" fill="currentColor" opacity="0.55"/>
            <path d="M 29 29 Q 25 25 23 23 Q 27 25 29 29 Z" fill="currentColor" opacity="0.55"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil">திருவாசகம்</span>
          <span class="wordmark-english">Thiruvaasagam</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="tv-hymn-page" id="hymn-container">
      <!-- Built by JS -->
    </div>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(139,26,26,.2);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--tv-flame,#8b1a1a);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>திருவாசகம் · <a href="../index.html" style="color:var(--tv-flame,#8b1a1a)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/hymns.js"></script>
  <script>
  (function(){
    const { sections, hymns } = window.TV_DATA;
    const params = new URLSearchParams(window.location.search);
    const hymnNum = parseInt(params.get('n'), 10) || 1;
    const container = document.getElementById('hymn-container');

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    const h = hymns.find(x => x.num === hymnNum);
    if (!h) {
      container.innerHTML = '<p style="text-align:center;padding:3rem;color:var(--ink-muted)">Hymn not found.</p>';
      return;
    }

    const secColors = { 1:'#8b1a1a', 2:'#7a4a08', 3:'#2a4a7a', 4:'#3a1a5a', 5:'#1a4a28' };
    const accentColor = secColors[h.section] || '#8b1a1a';

    document.title = `${h.tamil} · Hymn ${h.num} · Thiruvaasagam`;
    document.getElementById('page-title').textContent = `${h.tamil} · Thiruvaasagam`;
    document.documentElement.style.setProperty('--tv-hymn-accent', accentColor);

    const prevH = hymns.find(x => x.num === hymnNum - 1);
    const nextH = hymns.find(x => x.num === hymnNum + 1);
    const sec = sections.find(s => s.num === h.section);

    const v = h.verseObj;

    container.innerHTML = `
      <nav class="tv-bc">
        <a href="../index.html">Library</a>
        <span class="sep">›</span>
        <a href="index.html">Thiruvaasagam</a>
        <span class="sep">›</span>
        <a href="index.html" style="color:${accentColor}">${esc(sec ? sec.tamil : '')}</a>
        <span class="sep">›</span>
        <span>${esc(h.tamil)}</span>
      </nav>

      <div class="tv-hymn-header">
        <div class="tv-hymn-num-label" style="color:${accentColor}">திருப்பாடல் ${h.num} · Hymn ${h.num} of 51</div>
        <div class="tv-metre-badge">${esc(h.metre)}</div>
        <h1 class="tv-hymn-h1" style="color:${accentColor}">${esc(h.tamil)}</h1>
        <div class="tv-hymn-h1-eng">${esc(h.english)}</div>
        <div class="tv-hymn-subtitle">${esc(h.subtitle)}</div>
        <div class="tv-hymn-meta-row">
          <span>${h.verses} verses</span>
          <span>${esc(h.metre.split(' (')[0])}</span>
          <span>${esc(h.site)}</span>
        </div>
      </div>

      <div class="tv-desc-block">${esc(h.desc)}</div>

      <div style="font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-muted);text-align:center;margin-bottom:.5rem;font-family:var(--font-display)">
        Opening Verse — வேர்ச்செய்யுள் முதல் பாடல்
      </div>
      ${h.verses > 1 ? '<div style="font-size:.8rem;color:var(--ink-muted);text-align:center;margin-bottom:1rem;font-family:var(--font-display);font-style:italic">This hymn contains ' + h.verses + ' verses — the opening verse is presented here as a gateway to the full text.</div>' : ''}

      <!-- Tamil text -->
      <div class="tv-tamil-panel">
        <div class="tv-panel-label">Tamil — முதல் பாடல் (First verse)</div>
        <pre class="tv-tamil-text">${escPre(v.tamil)}</pre>
        <div style="margin-top:.85rem">
          <button class="tv-listen-btn" onclick="speakTamil(${JSON.stringify(v.tamil)})">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            Listen · கேட்க
          </button>
        </div>
      </div>

      <!-- Transliteration -->
      <div class="tv-collapsible">
        <button class="tv-panel-toggle" data-target="translit-${h.num}">
          <span>Transliteration — ஒலிப்பெயர்ப்பு</span>
          <span class="arrow">▾</span>
        </button>
        <div class="tv-panel-body" id="translit-${h.num}">
          <pre class="tv-transliteration">${escPre(v.transliteration)}</pre>
        </div>
      </div>

      <!-- English translation -->
      <div class="tv-collapsible">
        <button class="tv-panel-toggle open" data-target="english-${h.num}">
          <span>English Translation — ஆங்கில மொழிபெயர்ப்பு</span>
          <span class="arrow">▾</span>
        </button>
        <div class="tv-panel-body open" id="english-${h.num}">
          <pre class="tv-english-text">${escPre(v.english)}</pre>
        </div>
      </div>

      <!-- Tamil Urai -->
      <div class="tv-collapsible">
        <button class="tv-panel-toggle" data-target="urai-${h.num}">
          <span>தமிழ் உரை — Tamil Commentary</span>
          <span class="arrow">▾</span>
        </button>
        <div class="tv-panel-body" id="urai-${h.num}">
          <div class="tv-urai-text">${esc(v.tamilUrai)}</div>
        </div>
      </div>

      <!-- Alt translation -->
      <div class="tv-collapsible">
        <button class="tv-panel-toggle" data-target="alt-${h.num}">
          <span>Alternative Translation</span>
          <span class="arrow">▾</span>
        </button>
        <div class="tv-panel-body" id="alt-${h.num}">
          <div class="tv-alt-text">${esc(v.altTranslation)}</div>
        </div>
      </div>

      <!-- Scholarly note -->
      <div class="tv-collapsible">
        <button class="tv-panel-toggle" data-target="note-${h.num}">
          <span>Scholarly Note — அறிவுரை</span>
          <span class="arrow">▾</span>
        </button>
        <div class="tv-panel-body" id="note-${h.num}">
          <div class="tv-note-text">${esc(v.note)}</div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="tv-hymn-nav">
        <a href="${prevH ? `hymn.html?n=${prevH.num}` : '#'}"
           class="tv-nav-link ${prevH ? '' : 'disabled'}">
          <div class="tv-nav-dir">← முந்தைய · Previous Hymn</div>
          <div class="tv-nav-tamil">${prevH ? esc(prevH.tamil) : '—'}</div>
          <div class="tv-nav-eng">${prevH ? esc(prevH.english) : ''}</div>
        </a>
        <a href="${nextH ? `hymn.html?n=${nextH.num}` : '#'}"
           class="tv-nav-link next ${nextH ? '' : 'disabled'}">
          <div class="tv-nav-dir">அடுத்தது · Next Hymn →</div>
          <div class="tv-nav-tamil">${nextH ? esc(nextH.tamil) : '—'}</div>
          <div class="tv-nav-eng">${nextH ? esc(nextH.english) : ''}</div>
        </a>
      </nav>`;

    // Toggle panels
    container.querySelectorAll('.tv-panel-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const isOpen = target.classList.contains('open');
        target.classList.toggle('open', !isOpen);
        btn.classList.toggle('open', !isOpen);
      });
    });
  })();
  </script>
  <script>
    function speakTamil(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(v => v.lang.startsWith('ta')) || voices.find(v => v.lang.startsWith('en-IN'));
      if (v) u.voice = v;
      u.lang = v ? v.lang : 'ta-IN';
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>
  <style>
    .tv-listen-btn {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .45rem .9rem;
      background: rgba(139,26,14,.08);
      border: 1px solid var(--tv-flame, #8b1a1a);
      border-radius: 20px;
      color: var(--tv-flame, #8b1a1a);
      font-family: var(--font-display);
      font-size: .8rem; letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: all .15s;
    }
    .tv-listen-btn:hover { background: var(--tv-flame, #8b1a1a); color: var(--bg-paper); }
  </style>
</body>
</html>
