<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">பாசுரம் · திருப்பள்ளியெழுச்சி</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="css/palliyeluchi.css"/>
  <style>
    :root {
      --pe-dawn:        #8b3a00;
      --pe-dawn-mid:    #b05010;
      --pe-dawn-pale:   rgba(139,58,0,.08);
      --pe-dawn-pale2:  rgba(139,58,0,.14);
      --pe-amber:       #6b2a00;
      --tp-flame:       #8b3a00;
      --tp-flame-mid:   #b05010;
      --tp-flame-pale:  rgba(139,58,0,.08);
      --tp-flame-pale2: rgba(139,58,0,.14);
      --tp-gold:        #8b3a00;
    }

    .pe-pasuram-page { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    .pe-bc {
      display:flex; align-items:center; gap:.5rem;
      font-size:.875rem; color:var(--ink-muted);
      margin-bottom:2rem; letter-spacing:.04em; flex-wrap:wrap;
    }
    .pe-bc a { color:var(--ink-secondary); text-decoration:none; }
    .pe-bc a:hover { color:var(--pe-dawn); }
    .pe-bc .sep { opacity:.45; }

    .pe-dawn-badge {
      display:inline-flex; align-items:center; gap:.45rem;
      background:rgba(139,58,0,.07);
      border:1px solid rgba(139,58,0,.22);
      border-radius:20px;
      padding:.3rem .85rem;
      font-family:var(--font-display);
      font-size:.75rem;
      color:var(--pe-dawn);
      letter-spacing:.1em;
      margin-bottom:1rem;
    }

    .pe-pasuram-card {
      position:relative;
      background:var(--bg-paper);
      background-image:
        linear-gradient(180deg, rgba(139,58,0,0) 0%, rgba(139,58,0,.03) 50%, rgba(139,58,0,0) 100%),
        repeating-linear-gradient(0deg,
          rgba(139,58,0,.02) 0px, rgba(139,58,0,.02) 1px,
          transparent 1px, transparent 8px);
      border:1px solid var(--border-medium);
      border-radius:4px;
      padding:3.5rem 3rem;
      box-shadow:var(--shadow-paper);
      overflow:hidden;
    }
    .pe-pasuram-card::before,
    .pe-pasuram-card::after {
      content:''; position:absolute; top:50%; transform:translateY(-50%);
      width:14px; height:14px; border-radius:50%;
      background:var(--bg-primary); border:1.5px solid var(--border-strong);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
    }
    .pe-pasuram-card::before { left:14px; }
    .pe-pasuram-card::after  { right:14px; }

    .pe-pasuram-num {
      text-align:center; font-family:var(--font-display);
      font-size:.78rem; letter-spacing:.28em; text-transform:uppercase;
      color:var(--pe-dawn); margin-bottom:.3rem;
    }
    .pe-incipit {
      text-align:center; font-family:var(--font-display);
      font-style:italic; font-size:1rem; color:var(--pe-dawn);
      margin-bottom:2rem; letter-spacing:.03em;
    }

    .pe-panel-label {
      font-family:var(--font-display); font-size:.72rem;
      letter-spacing:.25em; text-transform:uppercase;
      color:var(--pe-dawn); margin-bottom:.65rem; font-weight:500;
    }
    .pe-tamil-panel {
      margin-bottom:1.75rem; padding-bottom:1.75rem;
      border-bottom:1px solid var(--border-subtle);
    }
    .pe-tamil-text {
      font-family:var(--font-tamil); font-size:1.875rem;
      line-height:1.65; color:var(--ink-primary); font-weight:600;
      white-space:pre-line; margin:0;
    }
    .pe-listen-btn {
      display:inline-flex; align-items:center; gap:.45rem;
      margin-top:.85rem; padding:.45rem .9rem;
      background:rgba(139,58,0,.07); border:1px solid var(--pe-dawn);
      border-radius:20px; color:var(--pe-dawn);
      font-family:var(--font-display); font-size:.8rem;
      letter-spacing:.1em; text-transform:uppercase;
      cursor:pointer; transition:all .15s;
    }
    .pe-listen-btn:hover { background:var(--pe-dawn); color:var(--bg-paper); }

    .pe-collapsible {
      background:var(--bg-paper); border:1px solid rgba(139,58,0,.2);
      border-radius:4px; margin-bottom:.75rem; overflow:hidden;
    }
    .pe-toggle {
      width:100%; text-align:left; background:none; border:none;
      cursor:pointer; padding:1rem 1.5rem;
      font-family:var(--font-display); font-size:.9rem;
      color:var(--ink-secondary); display:flex; align-items:center;
      justify-content:space-between;
      border-bottom:1px solid rgba(139,58,0,.12); transition:background .12s;
    }
    .pe-toggle:hover { background:rgba(139,58,0,.07); }
    .pe-toggle .arrow { font-size:.75rem; transition:transform .2s; color:var(--pe-dawn); }
    .pe-toggle.open .arrow { transform:rotate(180deg); }
    .pe-panel-body { padding:1.2rem 1.5rem 1.4rem; display:none; }
    .pe-panel-body.open { display:block; }

    .pe-translit { font-family:var(--font-body); font-style:italic; font-size:1.15rem; line-height:1.65; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .pe-english  { font-family:var(--font-display); font-size:1.25rem; font-style:italic; line-height:1.65; color:var(--ink-primary); white-space:pre-line; margin:0; }
    .pe-urai     { font-family:var(--font-tamil); font-size:1.0625rem; line-height:1.85; color:var(--ink-secondary); }
    .pe-alt      { font-family:var(--font-display); font-style:italic; font-size:1.1rem; line-height:1.7; color:var(--ink-secondary); white-space:pre-line; margin:0; }
    .pe-theme    { font-family:var(--font-body); font-size:.975rem; line-height:1.75; color:var(--ink-secondary); }
    .pe-note     { font-family:var(--font-body); font-size:.975rem; line-height:1.8; color:var(--ink-secondary); }

    /* Progress strip */
    .pe-progress {
      display:flex; height:5px; border-radius:3px; overflow:hidden;
      margin-bottom:1.5rem; gap:2px;
    }
    .pe-progress-seg {
      flex:1; border-radius:2px;
      transition:opacity .2s;
    }
    .pe-progress-seg.inactive { opacity:.18; }

    .pe-nav {
      display:grid; grid-template-columns:1fr 1fr;
      gap:1rem; margin-top:2.5rem;
    }
    .pe-nav-link {
      display:block; padding:1.2rem 1.4rem;
      background:var(--bg-paper); border:1px solid var(--border-subtle);
      border-radius:4px; text-decoration:none; color:inherit;
      transition:all .2s ease;
    }
    .pe-nav-link:hover { border-color:var(--pe-dawn); transform:translateY(-2px); box-shadow:var(--shadow-paper); }
    .pe-nav-link.next { text-align:right; }
    .pe-nav-link.disabled { opacity:.35; pointer-events:none; }
    .pe-nav-dir    { font-family:var(--font-display); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin-bottom:.35rem; }
    .pe-nav-dawn   { font-family:var(--font-display); font-size:.72rem; color:var(--pe-dawn); opacity:.75; margin-bottom:.15rem; }
    .pe-nav-incipit{ font-family:var(--font-display); font-style:italic; font-size:.85rem; color:var(--pe-dawn); margin-bottom:.2rem; }
    .pe-nav-tamil  { font-family:var(--font-tamil); font-size:.95rem; color:var(--ink-primary); line-height:1.4; }

    @media (max-width:640px) {
      .pe-pasuram-card { padding:2.5rem 1.5rem; }
      .pe-tamil-text   { font-size:1.5rem; }
      .pe-nav          { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <span class="mark" style="color:var(--pe-dawn,#8b3a00)">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"
               fill="none" stroke="currentColor" stroke-width="1.4"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="26" x2="36" y2="26" stroke-width="1.2" opacity=".5"/>
            <path d="M 12 26 A 8 8 0 0 1 28 26 Z" fill="currentColor" opacity=".85" stroke="none"/>
            <line x1="20" y1="14" x2="20" y2="10" stroke-width="1.3" opacity=".7"/>
            <line x1="27" y1="16" x2="30" y2="13" stroke-width="1.2" opacity=".6"/>
            <line x1="13" y1="16" x2="10" y2="13" stroke-width="1.2" opacity=".6"/>
            <line x1="30" y1="22" x2="34" y2="20" stroke-width="1.1" opacity=".5"/>
            <line x1="10" y1="22" x2="6"  y2="20" stroke-width="1.1" opacity=".5"/>
            <path d="M 16 30 Q 20 26 24 30 Q 20 34 16 30 Z" fill="currentColor" opacity=".35" stroke="none"/>
          </svg>
        </span>
        <span class="wordmark">
          <span class="wordmark-tamil" style="color:var(--pe-dawn,#8b3a00)">திருப்பள்ளியெழுச்சி</span>
          <span class="wordmark-english">Tiruppalliyeḷucci</span>
        </span>
      </a>
      <nav class="site-nav">
        <a href="../index.html">← Library</a>
        <a href="index.html">All Pāsurams</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <article class="pe-pasuram-page">
      <nav class="pe-bc" id="bc"></nav>
      <div class="pe-progress" id="progress"></div>
      <div id="dawn-badge"></div>
      <div class="pe-pasuram-card" id="pasuram-card"></div>
      <nav class="pe-nav" id="pasuram-nav"></nav>
    </article>
  </main>

  <footer style="text-align:center;padding:2.5rem 1.5rem;border-top:1px solid rgba(139,58,0,.15);color:var(--ink-muted);font-size:.875rem;letter-spacing:.05em;margin-top:1rem">
    <div style="color:var(--pe-dawn,#8b3a00);letter-spacing:1em;padding-left:1em;margin-bottom:.5rem;opacity:.4">❧ ❧ ❧</div>
    <div>திருப்பள்ளியெழுச்சி · <a href="../index.html" style="color:var(--pe-dawn,#8b3a00)">Tamil Literature Library</a></div>
  </footer>

  <script src="data/verses.js"></script>
  <script>
  (function(){
    const { verses } = window.TPE_DATA;
    const params = new URLSearchParams(window.location.search);
    const num    = parseInt(params.get('n'), 10) || 1;
    const verse  = verses.find(v => v.num === num);
    const card   = document.getElementById('pasuram-card');
    const nav    = document.getElementById('pasuram-nav');
    const bc     = document.getElementById('bc');

    const dawnLabels = [
      'First Call', 'Dark Lord', 'Stumbling Devotees', 'Star Thief',
      'Lord Wakes', 'Cuckoo & Jasmine', 'Open Your Eyes', 'Lamps at Dawn',
      'Temple Tower', 'Phalaśruti'
    ];
    const segColors = [
      '#1a2a4a','#243060','#3a3060','#5a3040',
      '#7a3820','#8b4a10','#9b5800','#a06a00',
      '#a07800','#8b6200'
    ];

    function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function escPre(s){ return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

    if (!verse) {
      card.innerHTML = '<p style="text-align:center;padding:2rem">Pāsuram not found. <a href="index.html" style="color:var(--pe-dawn)">Return →</a></p>';
      return;
    }

    const idx = verses.findIndex(v => v.num === num);

    document.getElementById('page-title').textContent =
      'Pāsuram ' + verse.num + ' · ' + verse.incipit + ' · திருப்பள்ளியெழுச்சி';

    bc.innerHTML =
      '<a href="../index.html">Library</a><span class="sep"> › </span>' +
      '<a href="index.html">Tiruppalliyeḷucci</a><span class="sep"> › </span>' +
      '<span>Pāsuram ' + verse.num + '</span>';

    // Colour progress strip
    const prog = document.getElementById('progress');
    verses.forEach((v, i) => {
      const seg = document.createElement('div');
      seg.className = 'pe-progress-seg' + (i !== idx ? ' inactive' : '');
      seg.style.background = segColors[i];
      prog.appendChild(seg);
    });

    // Dawn badge
    const badge = document.getElementById('dawn-badge');
    badge.innerHTML = '<div class="pe-dawn-badge">🌅 ' + esc(dawnLabels[idx] || '') + '</div>';

    card.innerHTML =
      '<div class="pe-pasuram-num">திருப்பள்ளியெழுச்சி · Pāsuram ' + verse.num + ' of 10</div>' +
      '<div class="pe-incipit">' + esc(verse.incipit) + '</div>' +

      '<div class="pe-tamil-panel">' +
        '<div class="pe-panel-label">Tamil · தமிழ்</div>' +
        '<pre class="pe-tamil-text">' + escPre(verse.tamil) + '</pre>' +
        '<button class="pe-listen-btn" onclick="speakTamil(' + JSON.stringify(verse.tamil) + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>' +
          'Listen · கேட்க' +
        '</button>' +
      '</div>' +

      collapsible('translit-' + num, 'Transliteration — ஒலிப்பெயர்ப்பு', false,
        '<pre class="pe-translit">' + escPre(verse.transliteration) + '</pre>') +
      collapsible('english-' + num, 'English Translation — ஆங்கில மொழிபெயர்ப்பு', true,
        '<pre class="pe-english">' + escPre(verse.english) + '</pre>') +
      collapsible('urai-' + num, 'தமிழ் உரை — Tamil Commentary', false,
        '<div class="pe-urai">' + esc(verse.tamilUrai) + '</div>') +
      collapsible('alt-' + num, 'Alternative Rendering', false,
        '<pre class="pe-alt">' + escPre(verse.altTranslation) + '</pre>') +
      collapsible('theme-' + num, 'Devotional Theme — பக்தி கருத்து', false,
        '<div class="pe-theme">' + esc(verse.theme) + '</div>') +
      collapsible('note-' + num, 'Literary & Theological Note', false,
        '<div class="pe-note">' + esc(verse.note) + '</div>');

    const prev = idx > 0 ? verses[idx - 1] : null;
    const next = idx < verses.length - 1 ? verses[idx + 1] : null;

    nav.innerHTML =
      '<a href="' + (prev ? 'pasuram.html?n=' + prev.num : '#') + '" class="pe-nav-link' + (prev ? '' : ' disabled') + '">' +
        '<div class="pe-nav-dir">← முந்தைய · Previous</div>' +
        (prev
          ? '<div class="pe-nav-dawn">' + esc(dawnLabels[idx-1]||'') + '</div>' +
            '<div class="pe-nav-incipit">' + esc(prev.incipit) + '</div>' +
            '<div class="pe-nav-tamil">' + esc(prev.tamil.split('\n')[0]) + '</div>'
          : '<div class="pe-nav-tamil">—</div>') +
      '</a>' +
      '<a href="' + (next ? 'pasuram.html?n=' + next.num : '#') + '" class="pe-nav-link next' + (next ? '' : ' disabled') + '">' +
        '<div class="pe-nav-dir">அடுத்தது · Next →</div>' +
        (next
          ? '<div class="pe-nav-dawn">' + esc(dawnLabels[idx+1]||'') + '</div>' +
            '<div class="pe-nav-incipit">' + esc(next.incipit) + '</div>' +
            '<div class="pe-nav-tamil">' + esc(next.tamil.split('\n')[0]) + '</div>'
          : '<div class="pe-nav-tamil">—</div>') +
      '</a>';

    document.querySelectorAll('.pe-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        const open = target.classList.contains('open');
        target.classList.toggle('open', !open);
        btn.classList.toggle('open', !open);
      });
    });

    function collapsible(id, label, startOpen, bodyHtml) {
      return '<div class="pe-collapsible">' +
        '<button class="pe-toggle' + (startOpen ? ' open' : '') + '" data-target="' + id + '">' +
          '<span>' + label + '</span><span class="arrow">▾</span>' +
        '</button>' +
        '<div class="pe-panel-body' + (startOpen ? ' open' : '') + '" id="' + id + '">' +
          bodyHtml +
        '</div>' +
      '</div>';
    }
  })();

  function speakTamil(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ' '));
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(v => v.lang.startsWith('ta')) || voices.find(v => v.lang.startsWith('en-IN'));
    if (v) u.voice = v;
    u.lang = v ? v.lang : 'ta-IN';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  </script>

</body>
</html>
